#--------------------------------------------------------------------------
#   Model Prompts
#--------------------------------------------------------------------------
#
#   List of model prompts suggested for the project. 
#   Input variables in the prompts are marked as {variable}.
#
#   To include other prompts in this list please refer to the
#   documentation of the RAG Application.
#
keywords: |
  Provide exactly 10 relevant keywords about {input}. 
  Each keyword should be a single word, all lowercase, and separated by commas. 
  If a keyword has more than 1 word, hypen them as 'word1-word2...'. 
  Format as: 'keyword1, keyword2, keyword-3, keyword4, keyword-word-5 ... , keyword10'. 
  Ensure the exact number of keywords is 10, without exceptions. 
  Do not add any additional text before or after the outputted string.

additional_context: |
  Provide a detailed description in one paragraph about {input}. 
  In addition to the one paragraph description, create 5 questions about this {input}, each question with an answer. 
  Format as: 'Q1. Question one? A1. Answer one. Q2. Question two? A2. Answer two...'. 

  Ensure output is exactly a one paragraph description (with no more or less than 50-60 words) 
  followed by 5 questions and answers (no additional text before or after). 

  Output format: 
  [paragraph description] 
  Q1. Question one? A1. Answer one. 
  Q2. Question two? A2. Answer two. 
  Q3. Question three? A3. Answer three. 
  Q4. Question four? A4. Answer four. 
  Q5. Question five? A5. Answer five.

image_context: |
  You MUST complete both tasks:
  
  [Task 1] FIRST: Write one paragraph (50-60 words) describing this image. Consider the page context: {text}
  
  [Task 2] SECOND: After your paragraph, create 5 Q&As about the image in this format:
  Q1. Question about the image? A1. Answer.
  Q2. Question about the image? A2. Answer.
  Q3. Question about the image? A3. Answer.
  Q4. Question about the image? A4. Answer.
  Q5. Question about the image? A5. Answer.
  
  Your complete response MUST begin with a paragraph description FOLLOWED BY the Q&A list.

rag: |
  Given this last user message:

  {lastUserContent}

  and this conversation history for context:

  {conversationContext}

  Your task is to generate a RAG-optimized version of the last message,
  strictly adhering to the provided context without introducing external 
  knowledge or assumptions.

  ANALYSIS STEPS:
  1. Examine the last user message:
      - Extract the core search topic
      - Identify key terms and concepts
      
  2. Review conversation history:
      - Consider the previous topics discussed, but prioritize the specific 
  request made in the last user message
      - If the last user message introduces a new topic or query, do not 
  assume it is related to the previous context unless explicitly stated
      - Incorporate relevant keywords from context only if they are directly 
  mentioned or implied in the last user message or what was mentioned by 
  the assistant
      - Consider the most recent topic or page discussed by the assistant, 
  if applicable
      
  3. Create a search-optimized message:
      - Use clear, specific terminology that aids vector search
      - Include synonyms or related terms when relevant
      - Maintain semantic search friendliness
      - Keep natural language structure

  Rules for RAG optimization:
  - Focus on descriptive terms that aid vector search, prioritizing these 
  over other aspects of the message
  - Include domain-specific terminology where applicable
  - Expand abbreviations into full terms
  - Connect related concepts with "and" or "related to"
  - Avoid question words that don't add semantic value

  Format: Return only the RAG-optimized message without additional text

chat: |
  You are a helpful assistant that discusses these pages:

  {basicPagesList}

  IMPORTANT INSTRUCTIONS:
  1. FOCUS PRIMARILY on the pages provided above - these are the current search results
  2. Be intelligent about conversation context:
     - IF the user is asking about a specific item they mentioned or you previously described, provide details about that item
     - IF the user is asking about a completely new topic unrelated to previous conversation, focus only on current search results
     - IF no relevant pages are found for a NEW topic, don't mention previous unrelated topics
  3. When FIRST mentioning a page, include its title, brief description, and page URL
  4. If users specifically ask for more details about a page, you have access to this additional information:

  {extendedPagesList}

  5. Never make up or mention pages that are not in the provided lists
  6. For follow-up questions about previously mentioned pages, respond naturally and helpfully
  7. For completely new search topics, focus only on current results without referencing previous unrelated topics

  8. When FIRST mentioning a page, always format the information exactly like this:
  **<title>**
  <description>
  https://projekte.g.hawk.de/projekt/example

  CONTEXT INTELLIGENCE:
  - Distinguish between follow-up questions about previous results vs. completely new searches
  - Only reference previous topics when the user's current question is directly related to them
  - For new unrelated topics, act as if starting fresh

chat_empty: |
  You are a helpful assistant. IMPORTANT: No pages were found matching the search criteria. 
  Please inform the user that no matching pages were found and suggest they try different search terms. 
  Do not make up or discuss any pages, as none were found in the database.


page_summary_university: |
  Summarize the following university web page as ONE concise paragraph (80–120 words).
  Prioritize: page purpose, who it is for (e.g., prospective students, current students, staff),
  key offerings (degree programs, services, events), and any critical dates, deadlines, locations, or contacts
  explicitly present in the text. Prefer concrete facts over slogans. Do not include headings, lists, or URLs.
  Normalize whitespace and avoid filler phrases.
  Content:
  {input}

pdf_content_university: |
  You are given Markdown extracted from a university PDF. Write ONE paragraph (80–120 words)
  summarizing: the document’s purpose, the most important rules/requirements/findings,
  any critical dates/deadlines, numbers, eligibility criteria, steps, or forms mentioned.
  Prefer concrete, verifiable details from the text. No headings, no lists, no Q&A, no URLs.
  Normalize whitespace and avoid fluff.
  PDF Markdown:
  {input}

keywords_university: |
  Provide exactly 10 concise, domain-relevant keywords for: {input}
  Rules:
  - single tokens when possible; if multiword is necessary, hyphenate (e.g., "study-abroad")
  - all lowercase
  - no duplicates, no filler
  - focus on university contexts (e.g., "admissions", "enrollment", "credit-transfer", "thesis", "semester-dates", "tuition")
  Output format only: keyword1, keyword2, keyword3, keyword4, keyword5, keyword6, keyword7, keyword8, keyword9, keyword10
