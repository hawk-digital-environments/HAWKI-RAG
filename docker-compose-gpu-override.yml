# ============================================================================
# NVIDIA GPU OVERRIDE (Adds GPU acceleration to base docker-compose.yml)
# ============================================================================
# This override file adds NVIDIA GPU support to the CPU-only base configuration.
# ============================================================================

services:
  hawki_rag_rerank:
    build:
      target: reranker-runtime
      args:
        TORCH_VARIANT: gpu
    image: hawki-rag-reranker:gpu-local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  hawki-rag-indexer-worker:
    build:
      target: indexer-runtime
      args:
        TORCH_VARIANT: gpu
    image: hawki-rag-indexer-worker:gpu-local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
