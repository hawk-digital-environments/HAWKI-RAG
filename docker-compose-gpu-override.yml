# ============================================================================
# NVIDIA GPU OVERRIDE (Adds GPU acceleration to base docker-compose.yml)
# ============================================================================
# This override file adds NVIDIA GPU support to the CPU-only base configuration.
# ============================================================================

services:
  hawki_rag_rerank:
    build:
      args:
        PYTHON_REQUIREMENTS_FILE: python_rag/requirements-rerank.gpu.lock.txt
        PYTORCH_WHEEL_INDEX: https://download.pytorch.org/whl/cu130
    image: hawki-rag-rerank:cuda-local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  raganything_api_gpu:
    build:
      context: .
      dockerfile: docker/bridge.Dockerfile
      target: python-rag
      args:
        PYTHON_REQUIREMENTS_FILE: python_rag/requirements.gpu.lock.txt
        PYTORCH_WHEEL_INDEX: https://download.pytorch.org/whl/cu130
    image: hawki-rag-python:cuda-local

  ollama:
    build:
      context: .
      dockerfile: docker/ollama.Dockerfile
    image: hawki-ollama:cuda
    pull_policy: never
    environment:
      OLLAMA_NUM_GPU: ${OLLAMA_NUM_GPU:-1}
      OLLAMA_GPU_LAYERS: ${OLLAMA_GPU_LAYERS:-999}
      OLLAMA_LLM_LIBRARY: cuda
      OLLAMA_MMAP: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
