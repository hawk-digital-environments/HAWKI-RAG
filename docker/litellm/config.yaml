model_list:
  # Backward-compatible local aliases.
  - model_name: hawki-chat
    litellm_params:
      model: os.environ/LITELLM_OLLAMA_CHAT_MODEL
      api_base: os.environ/LITELLM_OLLAMA_API_BASE

  - model_name: hawki-embedding
    litellm_params:
      model: os.environ/LITELLM_OLLAMA_EMBED_MODEL
      api_base: os.environ/LITELLM_OLLAMA_API_BASE

  - model_name: hawki-vision
    litellm_params:
      model: os.environ/LITELLM_OLLAMA_VISION_MODEL
      api_base: os.environ/LITELLM_OLLAMA_API_BASE

  # Explicit local Ollama routes.
  - model_name: hawki-ollama-chat
    litellm_params:
      model: os.environ/LITELLM_OLLAMA_CHAT_MODEL
      api_base: os.environ/LITELLM_OLLAMA_API_BASE

  - model_name: hawki-ollama-embedding
    litellm_params:
      model: os.environ/LITELLM_OLLAMA_EMBED_MODEL
      api_base: os.environ/LITELLM_OLLAMA_API_BASE

  - model_name: hawki-ollama-vision
    litellm_params:
      model: os.environ/LITELLM_OLLAMA_VISION_MODEL
      api_base: os.environ/LITELLM_OLLAMA_API_BASE

  # OpenAI routes. They remain listed without a key so operators can configure
  # the deployment later; calls fail closed until OPENAI_API_KEY is present.
  - model_name: hawki-gpt-chat
    litellm_params:
      model: os.environ/LITELLM_OPENAI_CHAT_MODEL
      api_base: os.environ/LITELLM_OPENAI_API_BASE
      api_key: os.environ/OPENAI_API_KEY

  - model_name: hawki-openai-embedding
    litellm_params:
      model: os.environ/LITELLM_OPENAI_EMBED_MODEL
      api_base: os.environ/LITELLM_OPENAI_API_BASE
      api_key: os.environ/OPENAI_API_KEY

  - model_name: hawki-gpt-vision
    litellm_params:
      model: os.environ/LITELLM_OPENAI_VISION_MODEL
      api_base: os.environ/LITELLM_OPENAI_API_BASE
      api_key: os.environ/OPENAI_API_KEY

  # Anthropic has no embeddings API, so Claude routes cover chat and vision.
  - model_name: hawki-claude-chat
    litellm_params:
      model: os.environ/LITELLM_ANTHROPIC_CHAT_MODEL
      api_base: os.environ/LITELLM_ANTHROPIC_API_BASE
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: hawki-claude-vision
    litellm_params:
      model: os.environ/LITELLM_ANTHROPIC_VISION_MODEL
      api_base: os.environ/LITELLM_ANTHROPIC_API_BASE
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
  request_timeout: 240
