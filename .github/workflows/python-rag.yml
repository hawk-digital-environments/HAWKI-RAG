name: Python RAG

on:
  pull_request:
    paths:
      - "python_rag/**"
      - "docker/python_rag/**"
      - "docker-compose*.yml"
      - ".dockerignore"
      - "Makefile"
      - "tests/**"
      - ".github/workflows/python-rag.yml"
  push:
    branches:
      - main
    paths:
      - "python_rag/**"
      - "docker/python_rag/**"
      - "docker-compose*.yml"
      - ".dockerignore"
      - "Makefile"
      - "tests/**"
      - ".github/workflows/python-rag.yml"

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"

      - name: Install pinned uv
        run: python -m pip install "uv==0.11.26"

      - name: Install ripgrep for boundary checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Verify lock and CPU/CUDA resolutions
        working-directory: python_rag
        run: uv lock --check

      - name: Verify CPU/CUDA resolution invariants
        run: make python-lock

      - name: Install the CPU data-plane environment
        working-directory: python_rag
        run: >-
          uv sync --frozen --group test --extra cpu
          --package hawki-workflow-worker
          --package hawki-scraper-worker
          --package hawki-converter-worker
          --package hawki-indexer-worker

      - name: Install the pinned workspace quality tools
        working-directory: python_rag
        run: uv sync --frozen --only-group lint --inexact

      - name: Install the isolated CPU reranker environment
        working-directory: python_rag
        env:
          UV_PROJECT_ENVIRONMENT: .venv-reranker
        run: uv sync --frozen --group test --package hawki-reranker --extra cpu

      - name: Verify package boundaries and line limits
        working-directory: python_rag
        run: |
          command -v rg >/dev/null
          assert_no_matches() {
            local status
            if rg -n "$@"; then
              echo "Forbidden dependency or legacy reference found." >&2
              exit 1
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                echo "Boundary search failed with exit code $status." >&2
                exit "$status"
              fi
            fi
          }
          services=(hawki_workflow_worker hawki_scraper_worker hawki_converter_worker hawki_indexer_worker hawki_reranker)
          for service in "${services[@]}"; do
            for other in "${services[@]}"; do
              if [ "$service" != "$other" ]; then
                assert_no_matches "(^|[[:space:]])(from|import)[[:space:]]+$other([.]|[[:space:]]|$)" "services/$service/src" --glob '*.py'
              fi
            done
          done
          assert_no_matches '(^|[[:space:]])(from|import)[[:space:]]+(psycopg|psycopg2)([.]|[[:space:]]|$)' packages services --glob '*.py'
          assert_no_matches '\b(fastapi|HTTPException)\b' services/hawki_indexer_worker/src --glob '*.py'
          assert_no_matches '(api\.main:app|raganything_api_gpu)' services ../docker-compose*.yml
          oversized="$(find . -type f -name '*.py' ! -path '*/.venv*/*' ! -path '*/build/*' -print0 | xargs -0 wc -l | awk '$1 > 600 && $2 != "total" {print}')"
          test -z "$oversized" || { printf '%s\n' "$oversized"; exit 1; }

      - name: Verify Python formatting and linting
        working-directory: python_rag
        run: |
          uv run --frozen --no-sync ruff format --check packages services tests
          uv run --frozen --no-sync ruff check packages services tests

      - name: Verify patch whitespace
        run: git diff --check HEAD^ HEAD

      - name: Run deterministic tests
        working-directory: python_rag
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          uv run --frozen --no-sync pytest -c pytest.ini -m "not integration"

      - name: Run reranker service tests in its isolated environment
        working-directory: python_rag
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          UV_PROJECT_ENVIRONMENT: .venv-reranker
        run: >-
          uv run --frozen --no-sync pytest -c pytest.ini
          services/hawki_reranker/tests

      - name: Validate Compose model
        env:
          RAG_COMPOSE_ENV_FILE: .env.example
        run: docker compose --env-file .env.example config --quiet
