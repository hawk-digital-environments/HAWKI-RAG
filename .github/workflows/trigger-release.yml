name: '[MANUAL] - 2. Trigger Release'

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release Branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - id: validate
        uses: hawk-digital-environments/hawk-pipeline-actions/validate-release-branch@v1

  test-docker-build:
    name: Test Docker Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # One entry per published image, matching the publish-version matrix
          # (both CPU and GPU dependency variants of the torch roles).
          - name: laravel
            dockerfile: docker/laravel.Dockerfile
            target: laravel-app
          - name: bridge
            dockerfile: docker/python_rag.Dockerfile
            target: bridge-runtime
          - name: rerank
            dockerfile: docker/python_rag.Dockerfile
            target: reranker-runtime
            build-args: TORCH_VARIANT=cpu
          - name: rerank-gpu
            dockerfile: docker/python_rag.Dockerfile
            target: reranker-runtime
            build-args: TORCH_VARIANT=gpu
          - name: workflow-worker
            dockerfile: docker/python_rag.Dockerfile
            target: workflow-runtime
          - name: scraper-worker
            dockerfile: docker/python_rag.Dockerfile
            target: scraper-runtime
          - name: converter-worker
            dockerfile: docker/python_rag.Dockerfile
            target: converter-runtime
          - name: indexer-worker
            dockerfile: docker/python_rag.Dockerfile
            target: indexer-runtime
            build-args: TORCH_VARIANT=cpu
          - name: indexer-worker-gpu
            dockerfile: docker/python_rag.Dockerfile
            target: indexer-runtime
            build-args: TORCH_VARIANT=gpu
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Both dependency variants are published as separate images; this only
      # verifies that the release branch builds cleanly for both platforms.
      - name: Test Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          platforms: linux/amd64,linux/arm64
          tags: digitalenvironments/hawki-rag:${{ matrix.name }}-release-test
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: Merge and Tag Release
    runs-on: ubuntu-latest
    needs: [ validate, test-docker-build ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - uses: hawk-digital-environments/hawk-pipeline-actions/trigger-release@v1
        with:
          version: ${{ needs.validate.outputs.version }}
          release-branch: ${{ github.ref_name }}