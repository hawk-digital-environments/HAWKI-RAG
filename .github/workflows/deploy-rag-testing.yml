# Deploys the HAWKI RAG stack to a testing instance, following the pattern of
# the HAWKI deploy pipelines:
#
#   1. Every role image is built for linux/amd64 and pushed to ghcr.io, tagged
#      <role>-test-<instance>-<sha> and <role>-test-<instance>-latest.
#   2. The Dokploy webhook for the instance is triggered; the central Dokploy
#      instance then deploys the stack onto the machine over SSH and pulls the
#      freshly pushed images (HAWKI_RAG_VERSION=test-<instance>-latest in its
#      environment configuration).
#
# This pipeline is decoupled from publish-version.yml, which publishes the
# public multi-arch release images to Docker Hub. Testing systems run CPU
# only, so the two torch roles build their CPU dependency variants here.
name: Deploy RAG to Testing

on:
  workflow_dispatch:
  push:
    branches:
      - 'hawk/test-1'
      - 'hawk/test-2'
      - 'hawk/test-3'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.instance.outputs.number }}
    steps:
      - name: Determine testing instance number
        id: instance
        run: echo "number=${GITHUB_REF_NAME##*-}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: laravel
            dockerfile: docker/laravel.Dockerfile
            target: laravel-app
          - name: bridge
            dockerfile: docker/python_rag.Dockerfile
            target: bridge-runtime
          - name: rerank
            dockerfile: docker/python_rag.Dockerfile
            target: reranker-runtime
            build-args: TORCH_VARIANT=cpu
          - name: workflow-worker
            dockerfile: docker/python_rag.Dockerfile
            target: workflow-runtime
          - name: scraper-worker
            dockerfile: docker/python_rag.Dockerfile
            target: scraper-runtime
          - name: converter-worker
            dockerfile: docker/python_rag.Dockerfile
            target: converter-runtime
          - name: indexer-worker
            dockerfile: docker/python_rag.Dockerfile
            target: indexer-runtime
            build-args: TORCH_VARIANT=cpu
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/hawk-digital-environments/hawki-rag:${{ matrix.name }}-test-${{ needs.setup.outputs.number }}-${{ github.sha }}
            ghcr.io/hawk-digital-environments/hawki-rag:${{ matrix.name }}-test-${{ needs.setup.outputs.number }}-latest
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=deploy-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=deploy-${{ matrix.name }}

  deploy:
    runs-on: ubuntu-latest
    needs: [ setup, build-and-push ]
    steps:
      - name: Trigger Dokploy webhook
        run: curl -fsSL "${{ secrets[format('DOKPLOY_DEPLOYMENT_WEBHOOK_TEST_{0}', needs.setup.outputs.number)] }}"

  remove-old-images:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "hawki-rag"
          # Tags are named <role>-test-N-<sha>, so one deployment produces
          # seven role tags; keep enough of them to cover a full deployment.
          image-tags: "*-test-${{ needs.setup.outputs.number }}-* !*-test-${{ needs.setup.outputs.number }}-latest"
          keep-n-most-recent: 8
          cut-off: 1h
