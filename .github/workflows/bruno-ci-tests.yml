name: Bruno API Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - "bruno/**"
      - ".github/workflows/bruno-ci-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bruno-tests:
    name: Bruno API Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rag-api
            collection_dir: bruno/rag-api
            tags: smoke
            require_token: true
          - name: rag-web
            collection_dir: bruno/rag-web
            tags: smoke
            require_token: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno smoke tests
        working-directory: ${{ matrix.collection_dir }}
        env:
          BASE_URL: ${{ secrets.RAG_BASE_URL }}
          RAG_API_TOKEN: ${{ secrets.RAG_API_TOKEN }}
          TAGS: ${{ matrix.tags }}
          REQUIRE_TOKEN: ${{ matrix.require_token }}
        run: |
          if [ -z "${BASE_URL}" ]; then
            echo "Missing required secret: RAG_BASE_URL"
            exit 1
          fi

          if [ "${REQUIRE_TOKEN}" = "true" ] && [ -z "${RAG_API_TOKEN}" ]; then
            echo "Missing required secret: RAG_API_TOKEN"
            exit 1
          fi

          mkdir -p reports
          bru run \
            --tags "${TAGS}" \
            --exclude-tags destructive \
            --env-var "baseUrl=${BASE_URL}" \
            --env-var "token=${RAG_API_TOKEN}" \
            --reporter-junit reports/bruno-junit.xml \
            --reporter-json reports/bruno-results.json \
            --reporter-html reports/bruno-report.html

      - name: Upload Bruno reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-${{ matrix.name }}-smoke-reports
          path: ${{ matrix.collection_dir }}/reports/
