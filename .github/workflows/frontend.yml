name: Frontend

on:
  push:
    paths: ["frontend/**", "resources/**", "tests/js/**", "package*.json", "vite.frontend.config.js", "tailwind.config.js", "postcss.config.js", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "resources/**", "tests/js/**", "package*.json", "vite.frontend.config.js", "tailwind.config.js", "postcss.config.js", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
