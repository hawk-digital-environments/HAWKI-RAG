info:
  name: List Datasets
  type: http
  seq: 2
  tags:
    - datasets
    - smoke

http:
  method: GET
  url: "{{baseUrl}}/api/datasets"
  params:
    - name: limit
      value: "{{datasetLimit}}"
      type: query
  headers:
    - name: Accept
      value: application/json

  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List datasets with optional pagination.

runtime:
  scripts:
    - type: tests
      code: |-
          test("List Datasets should return 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

          test("List Datasets should return dataset collection contract", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
            expect(body).to.have.property("success", true);
            expect(body).to.have.property("datasets").that.is.an("array");
            for (const dataset of body.datasets) {
              expect(dataset).to.be.an("object");
              expect(dataset).to.have.property("datasetId").that.is.a("string");
              expect(dataset).to.have.property("name");
              expect(dataset).to.have.property("status");
            }
          });

          test("List Datasets should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });
