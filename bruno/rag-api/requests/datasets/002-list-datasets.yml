info:
  name: List Datasets
  type: http
  seq: 2
  tags:
    - datasets
    - smoke

http:
  method: GET
  url: "{{baseUrl}}/api/datasets"
  params:
    - name: limit
      value: "{{datasetLimit}}"
      type: query
  headers:
    - name: Accept
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List datasets with optional pagination.

runtime:
  scripts:
    - type: tests
      code: |-
          test("List Datasets" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("List Datasets" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("List Datasets" + " should not return an error payload type", function () {
            const body = res.getBody();
            if (body && typeof body.success === "boolean") {
              expect(body.success).to.be.oneOf([true, false]);
            }
          });

          test("List Datasets" + " should return datasets list shape", function () {
            const body = res.getBody();
            if (body && Array.isArray(body.datasets)) {
              expect(body.datasets).to.be.an("array");
            }
          });

          test("List Datasets" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });
