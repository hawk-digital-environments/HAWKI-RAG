info:
  name: List Documents
  type: http
  seq: 5
  tags:
    - documents
    - smoke

http:
  method: GET
  url: "{{baseUrl}}/api/documents"
  params:
    - name: dataset_id
      value: "{{datasetId}}"
      type: query
    - name: datasetId
      value: "{{datasetId}}"
      type: query
    - name: q
      value: "{{searchQuery}}"
      type: query
    - name: search
      value: "{{searchQuery}}"
      type: query
    - name: limit
      value: "{{documentLimit}}"
      type: query
  headers:
    - name: Accept
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List documents by optional dataset filter and query term.

runtime:
  scripts:
    - type: tests
      code: |-
          test("List Documents" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("List Documents" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("List Documents" + " should not return an error payload type", function () {
            const body = res.getBody();
            if (body && typeof body.success === "boolean") {
              expect(body.success).to.be.oneOf([true, false]);
            }
          });

          test("List Documents" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });
