info:
  name: List Documents
  type: http
  seq: 5
  tags:
    - documents
    - smoke

http:
  method: GET
  url: "{{baseUrl}}/api/documents"
  params:
    - name: dataset_id
      value: "{{datasetId}}"
      type: query
    - name: datasetId
      value: "{{datasetId}}"
      type: query
    - name: q
      value: "{{searchQuery}}"
      type: query
    - name: search
      value: "{{searchQuery}}"
      type: query
    - name: limit
      value: "{{documentLimit}}"
      type: query
  headers:
    - name: Accept
      value: application/json

  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List documents by optional dataset filter and query term.

runtime:
  scripts:
    - type: tests
      code: |-
          test("List Documents should return 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

          test("List Documents should return document collection contract", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
            expect(body).to.have.property("success", true);
            expect(body).to.have.property("documents").that.is.an("array");
            for (const document of body.documents) {
              expect(document).to.be.an("object");
              expect(document).to.have.property("id").that.is.a("string");
              expect(document).to.have.property("datasetId");
              expect(document).to.have.property("contentType");
              expect(document).to.have.property("qdrantStatus");
              expect(document).to.have.property("neo4jStatus");
            }
          });

          test("List Documents should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });
