info:
  name: Retry Job
  type: http
  seq: 21
  tags:
    - pipeline
    - recovery
    - retry

http:
  method: POST
  url: "{{baseUrl}}/api/pipeline/recovery/jobs/:jobId/retry"
  params:
    - name: jobId
      value: "{{jobId}}"
      type: path
  headers:
    - name: Accept
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retry one failed job.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Retry Job" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Retry Job" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Retry Job" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

