info:
  name: List Failed Jobs
  type: http
  seq: 19
  tags:
    - pipeline
    - recovery

http:
  method: GET
  url: "{{baseUrl}}/api/pipeline/recovery/failed-jobs"
  params:
    - name: limit
      value: "{{failedJobLimit}}"
      type: query
    - name: taskId
      value: "{{taskId}}"
      type: query
    - name: datasetId
      value: "{{datasetId}}"
      type: query
  headers:
    - name: Accept
      value: application/json

  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List failed jobs across tasks/datasets.

runtime:
  scripts:
    - type: tests
      code: |-
          test("List Failed Jobs should return 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

          test("List Failed Jobs should return failed jobs contract", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
            expect(body).to.have.property("success", true);
            expect(body).to.have.property("jobs").that.is.an("array");
            for (const job of body.jobs) {
              expect(job).to.be.an("object");
              expect(job).to.have.property("jobId").that.is.a("string");
              expect(job).to.have.property("taskId");
              expect(job).to.have.property("status").that.is.a("string");
            }
          });

          test("List Failed Jobs should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });
