info:
  name: Retry All Jobs
  type: http
  seq: 22
  tags:
    - pipeline
    - recovery
    - retry

http:
  method: POST
  url: "{{baseUrl}}/api/pipeline/recovery/retry-all"
  headers:
    - name: Accept
      value: application/json

  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retry all failed jobs in recovery queue.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Retry All Jobs" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Retry All Jobs" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Retry All Jobs" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

