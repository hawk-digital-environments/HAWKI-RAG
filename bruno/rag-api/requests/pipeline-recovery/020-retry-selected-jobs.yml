info:
  name: Retry Selected Jobs
  type: http
  seq: 20
  tags:
    - pipeline
    - recovery
    - retry

http:
  method: POST
  url: "{{baseUrl}}/api/pipeline/recovery/jobs/retry-selected"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "job_ids": [
          "{{jobId}}",
          "{{jobId2}}"
        ],
        "jobIds": [
          "{{jobId}}",
          "{{jobId2}}"
        ]
      }

  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retry selected failed jobs.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Retry Selected Jobs" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Retry Selected Jobs" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Retry Selected Jobs" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

