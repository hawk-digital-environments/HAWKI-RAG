info:
  name: Pipeline Health
  type: http
  seq: 17
  tags:
    - pipeline
    - health
    - smoke

http:
  method: GET
  url: "{{baseUrl}}/api/pipeline/health"
  params:
    - name: timeout
      value: "{{pipelineHealthTimeout}}"
      type: query
  headers:
    - name: Accept
      value: application/json

  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Checks runtime health of pipeline services.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Pipeline Health should return 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

          test("Pipeline Health should return health contract", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
            expect(body).to.have.property("success", true);
            expect(body).to.have.property("checkedAt").that.is.a("string");
            expect(body).to.have.property("checks").that.is.an("array");
            for (const check of body.checks) {
              expect(check).to.have.property("name").that.is.a("string");
              expect(check).to.have.property("status").that.is.a("string");
              expect(check).to.have.property("detail").that.is.a("string");
              expect(check).to.have.property("fix").that.is.a("string");
            }
          });

          test("Pipeline Health should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });
