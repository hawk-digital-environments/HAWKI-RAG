info:
  name: Upload Pipeline File
  type: http
  seq: 18
  tags:
    - pipeline
    - mutation

http:
  method: POST
  url: "{{baseUrl}}/api/pipeline/controller/files"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - "{{file}}"
        contentType: application/pdf
      - name: dataset_id
        type: text
        value: "{{datasetId}}"
      - name: graph
        type: text
        value: "{{graph}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Upload a file for pipeline ingestion.

  Required variables:
  - baseUrl
  - file
  - datasetId
  - graph

  Expected result:
  - 201 with success=true, taskId, jobId, datasetId, and dashboard/controller URLs.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Upload Pipeline File should create an upload task", function () {
            expect(res.getStatus()).to.equal(201);
          });

          test("Upload Pipeline File should return upload metadata", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
            expect(body).to.have.property("success", true);
            expect(body).to.have.property("taskId").that.is.a("string").and.is.not.empty;
            expect(body).to.have.property("jobId").that.is.a("string").and.is.not.empty;
            expect(body).to.have.property("datasetId").that.is.a("string").and.is.not.empty;
            expect(body).to.have.property("dashboardUrl").that.is.a("string").and.is.not.empty;
            expect(body).to.have.property("controllerUrl").that.is.a("string").and.is.not.empty;
          });

          test("Upload Pipeline File should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });
