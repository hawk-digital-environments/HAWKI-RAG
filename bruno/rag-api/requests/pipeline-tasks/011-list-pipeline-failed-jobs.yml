info:
  name: List Pipeline Failed Jobs
  type: http
  seq: 11
  tags:
    - pipeline
    - jobs
    - retry

http:
  method: GET
  url: "{{baseUrl}}/api/pipeline/tasks/:taskId/failed-jobs"
  params:
    - name: taskId
      value: "{{taskId}}"
      type: path
  headers:
    - name: Accept
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List failed jobs for a pipeline task.

runtime:
  scripts:
    - type: tests
      code: |-
          test("List Pipeline Failed Jobs" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("List Pipeline Failed Jobs" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("List Pipeline Failed Jobs" + " should not return an error payload type", function () {
            const body = res.getBody();
            if (body && typeof body.success === "boolean") {
              expect(body.success).to.be.oneOf([true, false]);
            }
          });

          test("List Pipeline Failed Jobs" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

