info:
  name: Upsert Pipeline Job
  type: http
  seq: 13
  tags:
    - pipeline
    - jobs
    - mutation

http:
  method: POST
  url: "{{baseUrl}}/api/pipeline/tasks/:taskId/jobs"
  params:
    - name: taskId
      value: "{{taskId}}"
      type: path
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "jobId": "{{jobId}}",
        "parentJobId": "{{parentJobId}}",
        "job_type": "{{jobType}}",
        "status": "{{pipelineJobStatus}}",
        "source_url": "{{sourceUrl}}",
        "local_path": "{{localPath}}",
        "content_hash": "{{contentHash}}",
        "metadata": {
          "retry_count": 0
        }
      }

  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Create or update a job under a task.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Upsert Pipeline Job" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Upsert Pipeline Job" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Upsert Pipeline Job" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });
