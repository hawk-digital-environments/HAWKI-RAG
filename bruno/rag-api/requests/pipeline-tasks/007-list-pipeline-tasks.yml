info:
  name: List Pipeline Tasks
  type: http
  seq: 7
  tags:
    - pipeline
    - list

http:
  method: GET
  url: "{{baseUrl}}/api/pipeline/tasks"
  params:
    - name: limit
      value: "{{pipelineTaskLimit}}"
      type: query
  headers:
    - name: Accept
      value: application/json

  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List pipeline tasks.

runtime:
  scripts:
    - type: tests
      code: |-
          test("List Pipeline Tasks should return 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

          test("List Pipeline Tasks should return task collection contract", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
            expect(body).to.have.property("success", true);
            expect(body).to.have.property("tasks").that.is.an("array");
            for (const task of body.tasks) {
              expect(task).to.be.an("object");
              expect(task).to.have.property("taskId").that.is.a("string");
              expect(task).to.have.property("status").that.is.a("string");
            }
          });

          test("List Pipeline Tasks should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });
