info:
  name: Cancel Pipeline Task
  type: http
  seq: 16
  tags:
    - pipeline
    - mutation

http:
  method: POST
  url: "{{baseUrl}}/api/pipeline/tasks/:taskId/cancel"
  params:
    - name: taskId
      value: "{{taskId}}"
      type: path
  headers:
    - name: Accept
      value: application/json

  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Cancel an in-flight pipeline task.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Cancel Pipeline Task" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Cancel Pipeline Task" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Cancel Pipeline Task" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

