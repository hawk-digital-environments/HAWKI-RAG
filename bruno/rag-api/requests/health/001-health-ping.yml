info:
  name: Health Ping
  type: http
  seq: 1
  tags:
    - health
    - smoke

http:
  method: GET
  url: "{{baseUrl}}/api/ping"
  headers:
    - name: Accept
      value: application/json

  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Basic liveness check for the API service.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Health Ping should return 200", function () {
            expect(res.getStatus()).to.equal(200);
          });

          test("Health Ping should return liveness payload", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
            expect(body).to.have.property("pong", true);
          });

          test("Health Ping should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });
