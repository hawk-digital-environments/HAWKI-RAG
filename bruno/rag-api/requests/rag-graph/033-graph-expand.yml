info:
  name: Graph Expand
  type: http
  seq: 33
  tags:
    - rag
    - graph
    - mutation

http:
  method: POST
  url: "{{baseUrl}}/api/rag/neo4j/graph/expand"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      {
        "node_id": "{{nodeId}}",
        "depth": 1,
        "limit": 80
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Expand graph from a node for exploration.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Graph Expand" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Graph Expand" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Graph Expand" + " should have auth configured", function () {
            const authHeader = req.getHeader("Authorization") || "";
            const token = bru.getVar("token") || bru.getEnvVar("token") || bru.getSecretVar("token") || "";
            expect(Boolean(authHeader) || Boolean(token)).to.equal(true);
          });

          test("Graph Expand" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

