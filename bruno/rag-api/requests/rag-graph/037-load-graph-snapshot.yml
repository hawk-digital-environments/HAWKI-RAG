info:
  name: Load Graph Snapshot
  type: http
  seq: 37
  tags:
    - rag
    - graph
    - snapshots

http:
  method: GET
  url: "{{baseUrl}}/api/rag/neo4j/graph/snapshots/:id"
  params:
    - name: id
      value: "{{snapshotId}}"
      type: path
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Load one snapshot by id.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Load Graph Snapshot" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Load Graph Snapshot" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Load Graph Snapshot" + " should not return an error payload type", function () {
            const body = res.getBody();
            if (body && typeof body.success === "boolean") {
              expect(body.success).to.be.oneOf([true, false]);
            }
          });

          test("Load Graph Snapshot" + " should have auth configured", function () {
            const authHeader = req.getHeader("Authorization") || "";
            const token = bru.getVar("token") || bru.getEnvVar("token") || bru.getSecretVar("token") || "";
            expect(Boolean(authHeader) || Boolean(token)).to.equal(true);
          });

          test("Load Graph Snapshot" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

