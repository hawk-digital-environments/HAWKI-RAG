info:
  name: Save Graph Snapshot
  type: http
  seq: 36
  tags:
    - rag
    - graph
    - snapshots

http:
  method: POST
  url: "{{baseUrl}}/api/rag/neo4j/graph/snapshots"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      {
        "name": "{{snapshotName}}",
        "scene": {
          "nodes": [],
          "edges": []
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Save current graph view to a named snapshot.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Save Graph Snapshot" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Save Graph Snapshot" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Save Graph Snapshot" + " should have auth configured", function () {
            const authHeader = req.getHeader("Authorization") || "";
            const token = bru.getVar("token") || bru.getEnvVar("token") || bru.getSecretVar("token") || "";
            expect(Boolean(authHeader) || Boolean(token)).to.equal(true);
          });

          test("Save Graph Snapshot" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

