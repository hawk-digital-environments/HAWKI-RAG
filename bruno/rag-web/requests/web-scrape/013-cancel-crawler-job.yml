info:
  name: Cancel Crawler Job
  type: http
  seq: 13
  tags:
    - scrape
    - mutation

http:
  method: POST
  url: "{{baseUrl}}/scraper/jobs/:jobId/cancel"
  params:
    - name: jobId
      value: "{{jobId}}"
      type: path
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Cancel a running crawler job.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Cancel Crawler Job" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Cancel Crawler Job" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Cancel Crawler Job" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

