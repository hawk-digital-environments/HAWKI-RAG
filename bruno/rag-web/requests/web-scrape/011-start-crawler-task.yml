info:
  name: Start Crawler Task
  type: http
  seq: 11
  tags:
    - scrape
    - mutation

http:
  method: POST
  url: "{{baseUrl}}/scraper/tasks/start"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "taskId": "{{taskId}}",
        "options": {
          "mode": "full"
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Start a crawler task by id.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Start Crawler Task" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Start Crawler Task" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Start Crawler Task" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

