info:
  name: Get All Scrapes
  type: http
  seq: 3
  tags:
    - scrape
    - read

http:
  method: POST
  url: "{{baseUrl}}/getAllScrapes"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Get list of scrape jobs.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Get All Scrapes" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Get All Scrapes" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Get All Scrapes" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

