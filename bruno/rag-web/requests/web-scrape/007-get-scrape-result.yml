info:
  name: Get Scrape Result
  type: http
  seq: 7
  tags:
    - scrape
    - read

http:
  method: POST
  url: "{{baseUrl}}/getScrapeResult"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "jobId": "{{jobId}}",
        "elementId": 1
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Fetch individual scrape result element by ID.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Get Scrape Result" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Get Scrape Result" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Get Scrape Result" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

