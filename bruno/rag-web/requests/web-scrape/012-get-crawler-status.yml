info:
  name: Get Crawler Status
  type: http
  seq: 12
  tags:
    - scrape
    - read

http:
  method: GET
  url: "{{baseUrl}}/scraper/status/:jobId"
  params:
    - name: jobId
      value: "{{jobId}}"
      type: path
  headers:
    - name: Accept
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Get crawler job status by ID.

runtime:
  scripts:
    - type: tests
      code: |-
          test("Get Crawler Status" + " should return a successful status", function () {
            const status = res.getStatus();
            expect(status).to.be.within(200, 299);
          });

          test("Get Crawler Status" + " should return JSON body", function () {
            const body = res.getBody();
            expect(body).to.be.an("object");
          });

          test("Get Crawler Status" + " should not return an error payload type", function () {
            const body = res.getBody();
            if (body && typeof body.success === "boolean") {
              expect(body.success).to.be.oneOf([true, false]);
            }
          });

          test("Get Crawler Status" + " should include response time", function () {
            const responseTime = res.getResponseTime();
            expect(responseTime).to.be.a("number");
            expect(responseTime).to.be.at.least(0);
          });

