[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os
path_separator = os
# The connection string is read from HAWKI_BACKEND_DB_DSN by the migration
# environment, so that the migrations and the service always use the same
# configuration and the same validation.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
