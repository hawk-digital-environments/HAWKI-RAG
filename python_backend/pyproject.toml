[project]
name = "hawki-backend"
version = "0.1.0"
description = "Standalone foundation for the future HAWKI public API backend"
requires-python = "==3.13.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.139.2",
    "hawki-rag-retrieval==0.1.0",
    "httpx==0.27.2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.4",
    "pyjwt[crypto]==2.15.1",
    "sqlalchemy==2.0.55",
]

[dependency-groups]
lint = [
    "ruff==0.15.22",
]
test = [
    "pytest==8.4.2",
]

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.uv.sources]
hawki-rag-retrieval = { path = "../python_rag/packages/retrieval", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
