[project]
name = "hawki-backend"
version = "0.1.0"
description = "Standalone foundation for the future HAWKI public API backend"
requires-python = "==3.13.14"
dependencies = [
    "fastapi==0.139.2",
    "pydantic==2.13.4",
]

[dependency-groups]
lint = [
    "ruff==0.15.22",
]
test = [
    "httpx==0.27.2",
    "pytest==8.4.2",
]

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
