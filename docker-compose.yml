services:
    # -------------------------------------------------
    # Laravel Application
    # -------------------------------------------------
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: hawki_app
        ports:
            - "8002:8000"
        volumes:
            - .:/var/www
#            - ./storage:/var/www/storage
            # Shared volume with crawler (Laravel public storage)
            - shared_storage:/var/www/storage/app/public
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            # Redis Configuration
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: "foobared"
            REDIS_DB: 0
            # RabbitMQ Configuration
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USER: ${RABBITMQ_USER:-admin}
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
            RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
            RABBITMQ_EXCHANGE: scrape_events
            RABBITMQ_EXCHANGE_TYPE: topic
            RABBITMQ_SCRAPE_QUEUE: scrape-events
            # Communication Service Configuration
            COMMUNICATION_SERVICE: ${COMMUNICATION_SERVICE:-rabbitmq}
            REDIS_SCRAPE_CHANNEL: scrape-events

        networks:
            - rawki-network
            - rawki-bridge
        depends_on:
#            - redis
            rabbitmq:
                condition: service_healthy
            crawler:
                condition: service_healthy

    # -------------------------------------------------
    # NGINX Reverse Proxy
    # -------------------------------------------------
    nginx:
        image: nginx:1.27-alpine
        container_name: rawki_nginx
        ports:
            - "8003:80"
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www
            - ./:/var/www/html
            - ./public:/var/www/html/public
            - ./storage/app/public:/var/www/html/storage
        depends_on:
            - app
        networks:
            - rawki-network
            - rawki-bridge

    # -------------------------------------------------
    # Redis (Pub/Sub for Laravel <-> Crawler)
    # -------------------------------------------------
#    redis:
#        image: redis:7-alpine
#        container_name: rawki_redis
#        ports:
#            - "6379:6379"
#        volumes:
#            - redis_data:/data
#        networks:
#            - rawki-network
#        restart: unless-stopped
#        command: redis-server --appendonly yes --requirepass foobared
#        healthcheck:
#            test: ["CMD", "redis-cli", "-a", "foobared", "ping"]
#            interval: 10s
#            timeout: 3s
#            retries: 5

    # -------------------------------------------------
    # RabbitMQ (Message Queue for Laravel <-> Microservices)
    # -------------------------------------------------
    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        container_name: rawki_rabbitmq
        ports:
            - "5672:5672"   # AMQP protocol port
            - "15672:15672" # Management UI port
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
            RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
            # Enable management plugin and other useful plugins
            RABBITMQ_PLUGINS: rabbitmq_management,rabbitmq_prometheus
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - rabbitmq_logs:/var/log/rabbitmq
        networks:
            - rawki-network
            - rawki-bridge
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s

    # -------------------------------------------------
    # External Crawler Microservice
    # -------------------------------------------------
    crawler:
        image: crawl4ai-fastapi:latest
        container_name: crawl4ai-service
        ports:
            - "8004:8000"
        environment:
            # Optional API security token
            - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}
            # Maximum concurrent crawl tasks
            - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-5}
            # Server configuration
            - HOST=${HOST:-0.0.0.0}
            - PORT=${PORT:-8000}
            # Optional LLM Provider Keys (for advanced crawl4ai features)
            - OPENAI_API_KEY=${OPENAI_API_KEY:-}
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
            # Communication Configuration
            - COMMUNICATION_METHOD=rabbitmq
            # Redis Pub/Sub Configuration (disabled)
            - REDIS_ENABLED=false
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_DB=0
            - REDIS_PASSWORD=foobared
            - REDIS_CHANNEL=scrape-events
            # RabbitMQ Configuration (enabled)
            - RABBITMQ_ENABLED=true
            - RABBITMQ_HOST=rabbitmq
            - RABBITMQ_PORT=5672
            - RABBITMQ_USER=${RABBITMQ_USER:-admin}
            - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin123}
            - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
            - RABBITMQ_EXCHANGE=scrape_events
            - RABBITMQ_QUEUE=scrape-events
            # WebSocket URL for real-time events (legacy, deprecated)
            # Example: ws://laravel-app:6001 for Laravel WebSocket
            - WEBSOCKET_URL=${WEBSOCKET_URL:-}
            # Data storage path for job files
            - DATA_PATH=${DATA_PATH:-/app/shared}
        volumes:
            # Mount data directory for job-specific storage (new structure)
            - ./data:/app/data
            # Mount output directory for backwards compatibility
            - ./output:/app/output
            # Shared memory for Playwright (prevents crashes)
            - /dev/shm:/dev/shm
            - shared_storage:/app/shared
        networks:
            - rawki-bridge
            - rawki-network
        depends_on:
#            - redis
            - rabbitmq
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        # Resource limits (adjust based on your needs)
        deploy:
            resources:
                limits:
                    cpus: '2'
                    memory: 2G
                reservations:
                    cpus: '1'
                    memory: 1G

