volumes:
    shared_storage:     # Shared Laravel storage <-> Crawler
    redis_data:
    rabbitmq_data:      # RabbitMQ persistent data
    rabbitmq_logs:      # RabbitMQ logs
    qdrant_data:
    ollama:


networks:
    rawki-network:
        external: true
    rawki-bridge:
        driver: bridge
