services:
    # -------------------------------------------------
    # Laravel Application
    # -------------------------------------------------
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: hawki_app
        ports:
            - "8002:8002"
        volumes:
            - .:/var/www
            - ./storage:/var/www/storage
            # Shared volume with crawler (Laravel public storage)
            - shared_storage:/var/www/storage/app/public
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            CRAWL_DIR: /var/www/storage/app/public
        networks:
            - hawki-network
        depends_on:
            - redis

    # -------------------------------------------------
    # NGINX Reverse Proxy
    # -------------------------------------------------
    nginx:
        image: nginx:1.27-alpine
        container_name: hawki_nginx
        ports:
            - "8003:80"
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www
        depends_on:
            - app
        networks:
            - hawki-network

    # -------------------------------------------------
    # Redis (Pub/Sub for Laravel <-> Crawler)
    # -------------------------------------------------
    redis:
        image: redis:7-alpine
        container_name: hawki_redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - hawki-network
        restart: unless-stopped
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5

    # -------------------------------------------------
    # External Crawler Microservice
    # -------------------------------------------------
    crawler:
        image: customcrawler
        container_name: hawki_crawler
        ports:
            - "8004:8000"
        environment:
            # Crawler Server
            HOST: 0.0.0.0
            PORT: 8000

            # Optional API Security
            CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}

            # Task Management
            MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-5}

            # Redis Pub/Sub
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_DB: 0
            REDIS_PASSWORD: ""
            REDIS_CHANNEL: scrape-events

            # Shared data path (Laravel storage)
            DATA_PATH: /app/shared

        volumes:
            # Job data (crawler internal)
            - ./data:/app/data

            # Backward compatibility output folder
            - ./output:/app/output

            # Shared volume with Laravel
            - shared_storage:/app/shared

            # Required for Playwright/Chromium
            - /dev/shm:/dev/shm

        networks:
            - hawki-network
        restart: unless-stopped

        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

