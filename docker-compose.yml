x-ollama-base: &ollama_base
  volumes:
    - ollama:/root/.ollama
    - ./scripts/gpu_guard.sh:/usr/local/bin/gpu_guard.sh:ro
  entrypoint: ["/usr/local/bin/gpu_guard.sh", "ollama"]
  command: ["serve"]
  environment:
    GPU_MIN_FREE_MB: ${GPU_MIN_FREE_MB:-4096}
  networks:
    default: {}
    hawki-network:
      aliases:
        - ollama
        - hawki_ollama
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
    interval: 20s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  # -------------------------------------------------
  # Laravel Application
  # -------------------------------------------------
  hawki_rag_app:
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
      target: laravel-app
      args:
        - DOCKER_PROJECT_HOST=ixdlab.hawk.de
        - DOCKER_PROJECT_PATH=/hawki-rag/
    container_name: hawki_rag_app
    volumes:
      - shared_storage:/app/shared
      - ./storage:/var/www/html/storage
      - ./docker/rag_app:/container/custom
      - ./:/var/www/html
    env_file:
      - ./.env
    environment:
      # ENVIRONMENT: 'development' # 'dev' or 'prod'
      # PHP_PROD_DEBUG: "true" # If you want to stay in prod mode, but need to live edit files
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      VIRTUAL_HOST: ixdlab.hawk.de
      VIRTUAL_PATH: /hawki-rag/
      VIRTUAL_DEST: /
      ENVIRONMENT: "development"
      PREFECT_ENABLED: ${PREFECT_ENABLED:-true}
      PREFECT_START_MODE: ${PREFECT_START_MODE:-api}
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
      PREFECT_DEPLOYMENT_NAME: ${PREFECT_DEPLOYMENT_NAME:-rag_task_flow/rag-task-flow}
      PREFECT_LARAVEL_BASE_URL: ${PREFECT_LARAVEL_BASE_URL:-http://hawki_rag_app}
    networks:
      - hawki-network
      - hosting_network
      - default

  # -------------------------------------------------
  # MariaDB Database for Laravel
  # -------------------------------------------------
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_APP_USERNAME:-rag_user}
      MARIADB_PASSWORD: ${DB_APP_PASSWORD:-change_me}
      TZ: Europe/Berlin
    ports:
      - "3306:3306"
    volumes:
      - hawki_mariadb_data:/var/lib/mysql
    logging:
      options:
        max-size: "128m"
        max-file: "3"

  # -------------------------------------------------
  # RabbitMQ Broker (AMQP + management UI)
  # -------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - default
      - hawki-network

  adminer:
    image: ${ADMINER_IMAGE:-adminer:latest}
    container_name: adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8005}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
      TZ: Europe/Berlin
      VIRTUAL_HOST: ixdlab.hawk.de
      VIRTUAL_PATH: /adminer/
      VIRTUAL_DEST: /
    networks:
      - hosting_network
      - default

  # -------------------------------------------------
  # Qdrant Vector DB
  # -------------------------------------------------
  qdrant:
    build:
      context: .
      dockerfile: docker/qdrant.Dockerfile
    image: hawki-qdrant:local
    pull_policy: never
    container_name: hawki_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # ports:
    #   - "6333:6333"
    #   - "6334:6334" # Qdrant gRPC port (optional, for advanced use cases)
  # -------------------------------------------------
  # Neo4j Graph DB
  # -------------------------------------------------
  hawki_rag_neo4j:
    image: neo4j:5.22
    container_name: hawki_rag_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474/browser"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # Cohere-compatible reranker (used by HAWKI RAG)
  # -------------------------------------------------
  hawki_rag_rerank:
    build:
      context: .
      dockerfile: Dockerfile
      target: rerank
    image: hawki-rag-rerank:local
    pull_policy: never
    container_name: hawki_rag_rerank
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # FastAPI bridge (Python RAG API)
  # -------------------------------------------------
  hawki_rag_bridge:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-rag
    image: hawki-rag-python:local
    pull_policy: never
    container_name: hawki_rag_bridge
    env_file:
      - ./.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://hawki_rag_neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      KG_MAX_GLEANING: "1"
      GRAPH_OLLAMA_RAG_MODEL: ${GRAPH_OLLAMA_RAG_MODEL:-llama3.2:3b}
      OLLAMA_CHAT_TIMEOUT: ${OLLAMA_CHAT_TIMEOUT:-60}
      GRAPH_PERF_LOG: "1"
      HAWKI_RAG_PUBLIC_DIR: /app/public
    volumes:
      - ./python_rag:/app
      - ./public:/app/public
      - shared_storage:/app/shared
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # -------------------------------------------------
  # Laravel converted-document ingestion worker (RabbitMQ orchestration + DB state)
  # -------------------------------------------------
  hawki-rag-ingestion-worker:
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
      target: laravel-app
      args:
        - DOCKER_PROJECT_HOST=ixdlab.hawk.de
        - DOCKER_PROJECT_PATH=/hawki-rag/
    container_name: hawki_rag_ingestion_worker
    profiles: ["rag-ingestion-worker"]
    env_file:
      - ./.env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ENVIRONMENT: "development"
      HAWKI_RAG_BRIDGE_URL: ${HAWKI_RAG_BRIDGE_URL:-http://hawki_rag_bridge:8000}
      SHARED_STORAGE_ROOT: ${SHARED_STORAGE_ROOT:-/app/shared}
      RABBITMQ_EVENTS_EXCHANGE: ${RABBITMQ_EVENTS_EXCHANGE:-pipeline.events}
      RABBITMQ_EVENTS_EXCHANGE_TYPE: ${RABBITMQ_EVENTS_EXCHANGE_TYPE:-direct}
      RABBITMQ_RETRY_EXCHANGE: ${RABBITMQ_RETRY_EXCHANGE:-pipeline.retry}
      RABBITMQ_RETRY_EXCHANGE_TYPE: ${RABBITMQ_RETRY_EXCHANGE_TYPE:-direct}
      RABBITMQ_FAILED_EXCHANGE: ${RABBITMQ_FAILED_EXCHANGE:-pipeline.failed}
      RABBITMQ_FAILED_EXCHANGE_TYPE: ${RABBITMQ_FAILED_EXCHANGE_TYPE:-direct}
      RABBITMQ_RAG_INGESTION_QUEUE: ${RABBITMQ_RAG_INGESTION_QUEUE:-rag_ingestion_jobs}
      RABBITMQ_DOCUMENT_CONVERTED_ROUTING_KEY: ${RABBITMQ_DOCUMENT_CONVERTED_ROUTING_KEY:-convert.document.completed}
      RABBITMQ_RAG_INGESTION_RETRY_QUEUE: ${RABBITMQ_RAG_INGESTION_RETRY_QUEUE:-rag_ingestion_jobs_retry}
      RABBITMQ_RAG_INGESTION_RETRY_ROUTING_KEY: ${RABBITMQ_RAG_INGESTION_RETRY_ROUTING_KEY:-convert.document.completed.retry}
      RABBITMQ_FAILED_QUEUE: ${RABBITMQ_RAG_INGESTION_FAILED_QUEUE:-rag_ingestion_failed_jobs}
      RABBITMQ_FAILED_ROUTING_KEY: ${RABBITMQ_FAILED_ROUTING_KEY:-pipeline.failed}
      RABBITMQ_RETRY_DELAY_MS: ${RABBITMQ_RETRY_DELAY_MS:-5000}
      RABBITMQ_PREFETCH_COUNT: ${RABBITMQ_PREFETCH_COUNT:-1}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      RABBITMQ_QUEUE_TYPE: ${RABBITMQ_QUEUE_TYPE:-quorum}
      RABBITMQ_PUBLISHER_CONFIRMS: ${RABBITMQ_PUBLISHER_CONFIRMS:-true}
      RABBITMQ_PERSISTENT_MESSAGES: ${RABBITMQ_PERSISTENT_MESSAGES:-true}
      JOB_SCHEMA_VERSION: ${JOB_SCHEMA_VERSION:-1}
      SERVICE_NAME: ${SERVICE_NAME:-hawki-rag}
    volumes:
      - shared_storage:/app/shared
      - ./storage:/var/www/html/storage
      - ./docker/rag_app:/container/custom
      - ./:/var/www/html
    command: ["php", "artisan", "rag:rabbit-ingestion-worker"]
    working_dir: /var/www/html
    depends_on:
      mariadb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      hawki_rag_bridge:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "list", "--raw"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - default
      - hawki-network

  # -------------------------------------------------
  # Laravel pipeline worker (scrape -> convert -> RabbitMQ publish)
  # -------------------------------------------------
  hawki-rag-pipeline-worker:
    image: rawki-hawki_rag_app
    pull_policy: never
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
      target: laravel-app
      args:
        - DOCKER_PROJECT_HOST=ixdlab.hawk.de
        - DOCKER_PROJECT_PATH=/hawki-rag/
    container_name: hawki_rag_pipeline_worker
    profiles: ["rag-ingestion-worker"]
    env_file:
      - ./.env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ENVIRONMENT: "development"
      SHARED_STORAGE_ROOT: ${SHARED_STORAGE_ROOT:-/app/shared}
    volumes:
      - shared_storage:/app/shared
      - ./storage:/var/www/html/storage
      - ./docker/rag_app:/container/custom
      - ./:/var/www/html
    command: ["php", "artisan", "queue:work", "database", "--queue=default", "--sleep=2", "--tries=3", "--timeout=7200"]
    working_dir: /var/www/html
    depends_on:
      mariadb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "list", "--raw"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - default
      - hawki-network

  # -------------------------------------------------
  # Laravel event-driven pipeline workers (RabbitMQ)
  # -------------------------------------------------
  hawki-rag-scraper-event-worker:
    image: rawki-hawki_rag_app
    pull_policy: never
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
      target: laravel-app
      args:
        - DOCKER_PROJECT_HOST=ixdlab.hawk.de
        - DOCKER_PROJECT_PATH=/hawki-rag/
    container_name: hawki_rag_scraper_event_worker
    profiles: ["pipeline-events"]
    env_file:
      - ./.env
    volumes:
      - shared_storage:/app/shared
      - ./storage:/var/www/html/storage
      - ./docker/rag_app:/container/custom
      - ./:/var/www/html
    command: ["php", "artisan", "pipeline:scraper-event-worker"]
    working_dir: /var/www/html
    depends_on:
      mariadb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  hawki-rag-converter-event-worker:
    image: rawki-hawki_rag_app
    pull_policy: never
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
      target: laravel-app
      args:
        - DOCKER_PROJECT_HOST=ixdlab.hawk.de
        - DOCKER_PROJECT_PATH=/hawki-rag/
    container_name: hawki_rag_converter_event_worker
    profiles: ["pipeline-events"]
    env_file:
      - ./.env
    volumes:
      - shared_storage:/app/shared
      - ./storage:/var/www/html/storage
      - ./docker/rag_app:/container/custom
      - ./:/var/www/html
    command: ["php", "artisan", "pipeline:converter-event-worker"]
    working_dir: /var/www/html
    depends_on:
      mariadb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  hawki-rag-ingestion-event-worker:
    image: rawki-hawki_rag_app
    pull_policy: never
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
      target: laravel-app
      args:
        - DOCKER_PROJECT_HOST=ixdlab.hawk.de
        - DOCKER_PROJECT_PATH=/hawki-rag/
    container_name: hawki_rag_ingestion_event_worker
    profiles: ["pipeline-events"]
    env_file:
      - ./.env
    volumes:
      - shared_storage:/app/shared
      - ./storage:/var/www/html/storage
      - ./docker/rag_app:/container/custom
      - ./:/var/www/html
    command: ["php", "artisan", "pipeline:ingestion-event-worker"]
    working_dir: /var/www/html
    depends_on:
      mariadb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      hawki_rag_bridge:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  # -------------------------------------------------
  # Prefect self-hosted UI/API and HAWKI RAG task supervisor
  # -------------------------------------------------
  prefect-server:
    image: prefecthq/prefect:3-python3.12
    container_name: prefect_server
    profiles: ["prefect"]
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_HOME: /root/.prefect
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://localhost:4200/api}
    ports:
      - "${PREFECT_UI_PORT:-4200}:4200"
    volumes:
      - prefect_data:/root/.prefect
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - default

  prefect-rag-task-runner:
    image: prefecthq/prefect:3-python3.12
    container_name: prefect_rag_task_runner
    profiles: ["prefect"]
    working_dir: /workspace
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      LARAVEL_BASE_URL: ${PREFECT_LARAVEL_BASE_URL:-http://hawki_rag_app}
      LARAVEL_API_TOKEN: ${PREFECT_LARAVEL_API_TOKEN:-}
      PREFECT_DEPLOYMENT_SHORT_NAME: ${PREFECT_DEPLOYMENT_SHORT_NAME:-rag-task-flow}
      PREFECT_TASK_POLL_INTERVAL_SECONDS: ${PREFECT_TASK_POLL_INTERVAL_SECONDS:-10}
      PREFECT_TASK_MAX_IDLE_SECONDS: ${PREFECT_TASK_MAX_IDLE_SECONDS:-3600}
    volumes:
      - ./:/workspace
    command:
      - bash
      - -lc
      - |
        until python -c "import urllib.request; urllib.request.urlopen('http://prefect-server:4200/api/health', timeout=3)" >/dev/null 2>&1; do
          echo "Waiting for Prefect server..."
          sleep 2
        done
        python prefect/serve_rag_task_flow.py
    depends_on:
      prefect-server:
        condition: service_healthy
      hawki_rag_app:
        condition: service_started
    restart: unless-stopped
    networks:
      - default

  # -------------------------------------------------
  # Crawler producer (external image/command, profile-based)
  # -------------------------------------------------
  crawler_producer:
    image: ${CRAWLER_PRODUCER_IMAGE:-ghcr.io/example/hawki-crawler-producer:latest}
    container_name: crawler_producer
    profiles: ["crawler-producer"]
    env_file:
      - ./.env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-jobs}
      RABBITMQ_MAIN_ROUTING_KEY: ${RABBITMQ_MAIN_ROUTING_KEY:-crawl}
    command: ${CRAWLER_PRODUCER_COMMAND:-python -m crawler_producer.main}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  # -------------------------------------------------
  # Ollama
  # -------------------------------------------------
  ollama:
    <<: *ollama_base
    image: ollama/ollama:latest
    pull_policy: always
    container_name: hawki_ollama

  # -------------------------------------------------
  # RAG-Anything API (GPU)
  # -------------------------------------------------
  raganything_api_gpu:
    image: hawki-rag-python:local
    pull_policy: never
    container_name: raganything_api_gpu
    profiles: ["gpu"]
    env_file:
      - ./.env
    environment:
      RAG_WORKING_DIR: /app/rag_storage
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://hawki_rag_neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      GPU_MIN_FREE_MB: ${GPU_MIN_FREE_MB:-4096}
    volumes:
      - ./python_rag:/app
      - rag_storage:/app/rag_storage
      - ./scripts/gpu_guard.sh:/usr/local/bin/gpu_guard.sh:ro
    command: ["/usr/local/bin/gpu_guard.sh", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003"]
    depends_on:
      - ollama
      - qdrant
      - hawki_rag_neo4j
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

volumes:
  shared_storage:
    name: rawki_shared_storage
  prefect_data:
    name: rawki_prefect_data
  qdrant_data:
  neo4j_data:
  hawki_mariadb_data:
  rabbitmq_data:
  ollama:
  rag_storage:

networks:
  hawki-network:
    name: hawki-network
    external: true
  hosting_network:
    driver: bridge
    external: true
