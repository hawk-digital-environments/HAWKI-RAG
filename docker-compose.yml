version: "3.9"

x-ollama-base: &ollama_base
  build:
    context: .
    dockerfile: docker/ollama.Dockerfile
  image: hawki-ollama:local
  volumes:
    - ollama:/root/.ollama
  networks:
    hawki-network:
      aliases:
        - ollama
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
    interval: 20s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  # -------------------------------------------------
  # Laravel Application
  # -------------------------------------------------
  hawki_rag_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: laravel-app
    container_name: hawki_rag_app
    volumes:
      - .:/var/www
      - shared_storage:/var/www/storage/app/public
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: hawki_rag_rabbitmq
      RABBITMQ_PORT: 5672
    networks:
      - hawki-network
    depends_on:
      hawki_rag_rabbitmq:
        condition: service_healthy

  # -------------------------------------------------
  # NGINX Reverse Proxy
  # -------------------------------------------------
  hawki_rag_nginx:
    image: nginx:1.27-alpine
    container_name: hawki_rag_nginx
    ports:
      - "8080:80" # the only public port
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www
      - ./public:/var/www/html/public
      - ./storage/app/public:/var/www/html/storage
    depends_on:
      - hawki_rag_app
    networks:
      - hawki-network

  # -------------------------------------------------
  # RabbitMQ (Message Queue for Laravel <-> Microservices)
  # -------------------------------------------------
  hawki_rag_rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hawki_rag_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    networks:
      - hawki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------------------------------
  # Qdrant Vector DB
  # -------------------------------------------------
  qdrant:
    image: hawki-qdrant:local
    container_name: hawki_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - hawki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "6333:6333"
      - "6334:6334" # Qdrant gRPC port (optional, for advanced use cases)
  # -------------------------------------------------
  # Neo4j Graph DB
  # -------------------------------------------------
  hawki_rag_neo4j:
    image: neo4j:5.22
    container_name: hawki_rag_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    networks:
      - hawki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474/browser"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # Cohere-compatible reranker (used by HAWKI RAG)
  # -------------------------------------------------
  hawki_rag_rerank:
    build:
      context: .
      dockerfile: Dockerfile
      target: rerank
    image: hawki-rag-rerank:local
    container_name: hawki_rag_rerank
    networks:
      - hawki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # FastAPI bridge (Python RAG API)
  # -------------------------------------------------
  hawki_rag_bridge:
    image: hawki-rag-python:local
    container_name: hawki_rag_bridge
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://hawki_rag_neo4j:7687
    volumes:
      - ./python_rag:/app
    networks:
      - hawki-network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # -------------------------------------------------
  # Ollama (CPU)
  # -------------------------------------------------
  ollama_cpu:
    <<: *ollama_base
    container_name: hawki_ollama_cpu
    profiles: ["cpu"]

  # -------------------------------------------------
  # RAG-Anything API (GPU)
  # -------------------------------------------------
  raganything_api_gpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-rag
    image: hawki-rag-python:local
    container_name: raganything_api_gpu
    profiles: ["gpu"]
    env_file:
      - ./python_rag/LightRAG.env
    environment:
      RAG_WORKING_DIR: /app/rag_storage
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://hawki_rag_neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - rag_storage:/app/rag_storage
    networks:
      - hawki-network
    depends_on:
      - ollama_gpu
      - qdrant
      - hawki_rag_neo4j
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  # -------------------------------------------------
  # Ollama (GPU)
  # -------------------------------------------------
  ollama_gpu:
    <<: *ollama_base
    container_name: hawki_ollama_gpu
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

volumes:
  shared_storage:
    external: true
    name: rawki_shared_storage
  redis_data:
  rabbitmq_data:
  rabbitmq_logs:
  qdrant_data:
  neo4j_data:
  ollama:
  rag_storage:

networks:
  hawki-network:
    driver: bridge
