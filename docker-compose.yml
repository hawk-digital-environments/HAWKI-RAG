services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8002:8002"
        volumes:
            - .:/var/www
            - ./storage:/var/www/storage
            - ../hawki-data/crawled-data:/data/crawled:ro
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - CRAWL_DIR=/data/crawled
        networks:
            - hawki-network

    nginx:
        image: nginx:1.27-alpine
        ports:
            - "8003:80"
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www
        depends_on:
            - app
        networks:
            - hawki-network

