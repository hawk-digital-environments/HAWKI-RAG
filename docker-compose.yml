x-service-env: &service_env
  env_file:
    - ${HAWKI_RAG_COMPOSE_ENV_FILE:-.env}

x-ollama-base: &ollama_base
  <<: *service_env
  volumes:
    - ollama:/root/.ollama
    - ./scripts/gpu_guard.sh:/usr/local/bin/gpu_guard.sh:ro
  entrypoint: ["/usr/local/bin/gpu_guard.sh", "ollama"]
  command: ["serve"]
  networks:
    default: {}
    hawki-network:
      aliases:
        - ollama
        - hawki_ollama
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 20s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  # -------------------------------------------------
  # Laravel Application
  # -------------------------------------------------
  hawki_rag_app:
    <<: *service_env
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
      target: laravel-app
      args:
        - DOCKER_PROJECT_HOST
        - DOCKER_PROJECT_PATH
        - DOCKER_PROJECT_PROTOCOL
    image: hawki-rag-app:local
    container_name: hawki_rag_app
    volumes:
      - shared_storage:/app/shared
      - shared_storage:/shared
      - ./storage:/var/www/html/storage
    networks:
      - hawki-network
      - hosting_network
      - default
    depends_on:
      hawki_rag_migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  # -------------------------------------------------
  # One-shot shared-storage and Laravel database migrator
  # -------------------------------------------------
  hawki_rag_migrator:
    <<: *service_env
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
      target: laravel-app
      args:
        - DOCKER_PROJECT_HOST
        - DOCKER_PROJECT_PATH
        - DOCKER_PROJECT_PROTOCOL
    image: hawki-rag-app:local
    container_name: hawki_rag_migrator
    user: "0:0"
    volumes:
      - shared_storage:/shared
      - ./storage:/var/www/html/storage
    working_dir: /var/www/html
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        mkdir -p /shared/sources /shared/logs /shared/public /shared/storage/logs;
        chgrp -R "$${PIPELINE_SHARED_STORAGE_GID}" /shared;
        chmod -R g+rwX /shared;
        setfacl -R -P -m "u:$${PIPELINE_SHARED_STORAGE_UID}:rwX,m::rwX" /shared;
        find /shared -type d -exec setfacl -m "d:u:$${PIPELINE_SHARED_STORAGE_UID}:rwx,d:g::rwx,d:m::rwx" {} +;
        find /shared -type d -exec chmod g+s {} +;
        exec php artisan migrate --force
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - default

  # -------------------------------------------------
  # PostgreSQL for Laravel metadata and Temporal persistence
  # -------------------------------------------------
  postgres:
    <<: *service_env
    image: postgres:16
    container_name: hawki_rag_postgres
    restart: always
    volumes:
      - hawki_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      options:
        max-size: "128m"
        max-file: "3"

  # -------------------------------------------------
  # Temporal Server and optional UI
  # -------------------------------------------------
  temporal:
    <<: *service_env
    image: temporalio/auto-setup:1.25.2
    container_name: temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - hawki-network

  temporal-ui:
    <<: *service_env
    profiles: ["temporal-ui"]
    image: temporalio/ui:2.34.0
    container_name: temporal_ui
    restart: unless-stopped
    ports:
      - "${TEMPORAL_UI_BIND_ADDRESS}:${TEMPORAL_UI_PORT}:8080"
    depends_on:
      temporal:
        condition: service_started
    networks:
      - default
      - hawki-network

  # -------------------------------------------------
  # Qdrant Vector DB
  # -------------------------------------------------
  qdrant:
    build:
      context: .
      dockerfile: docker/qdrant.Dockerfile
    image: hawki-qdrant:local
    pull_policy: never
    container_name: hawki_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # ports:
    #   - "6333:6333"
    #   - "6334:6334" # Qdrant gRPC port (optional, for advanced use cases)
  # -------------------------------------------------
  # Neo4j Graph DB
  # -------------------------------------------------
  hawki_rag_neo4j:
    <<: *service_env
    image: neo4j:5.22
    container_name: hawki_rag_neo4j
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474/browser"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # Cohere-compatible reranker (used by HAWKI RAG)
  # -------------------------------------------------
  hawki_rag_rerank:
    build:
      context: .
      dockerfile: python_rag/services/hawki_reranker/Dockerfile
      args:
        TORCH_VARIANT: cpu
    image: hawki-rag-reranker:local
    pull_policy: never
    container_name: hawki_rag_rerank
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # Read-only FastAPI bridge (query, configuration, health, and Temporal control)
  # -------------------------------------------------
  hawki_rag_bridge:
    <<: *service_env
    build:
      context: .
      dockerfile: python_rag/services/hawki_bridge/Dockerfile
    image: hawki-rag-bridge:local
    pull_policy: never
    container_name: hawki_rag_bridge
    user: "10001:10001"
    depends_on:
      qdrant:
        condition: service_healthy
      hawki_rag_neo4j:
        condition: service_healthy
      temporal:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health?runtime=false', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # Python Temporal workers
  # -------------------------------------------------
  hawki-rag-temporal-workflow-worker:
    <<: *service_env
    build:
      context: .
      dockerfile: python_rag/services/hawki_workflow_worker/Dockerfile
    image: hawki-rag-workflow-worker:local
    pull_policy: never
    container_name: hawki_rag_temporal_workflow_worker
    user: "10001:10001"
    depends_on:
      temporal:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  hawki-rag-temporal-scraper-worker:
    <<: *service_env
    build:
      context: .
      dockerfile: python_rag/services/hawki_scraper_worker/Dockerfile
    image: hawki-rag-scraper-worker:local
    pull_policy: never
    container_name: hawki_rag_temporal_scraper_worker
    user: "10001:10001"
    volumes:
      - shared_storage:/shared
    group_add:
      - "${PGID}"
    depends_on:
      hawki_rag_migrator:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      hawki_rag_app:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  hawki-rag-temporal-converter-worker:
    <<: *service_env
    build:
      context: .
      dockerfile: python_rag/services/hawki_converter_worker/Dockerfile
    image: hawki-rag-converter-worker:local
    pull_policy: never
    container_name: hawki_rag_temporal_converter_worker
    user: "10001:10001"
    volumes:
      - shared_storage:/shared
    group_add:
      - "${PGID}"
    depends_on:
      hawki_rag_migrator:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      hawki_rag_app:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  hawki-rag-indexer-worker:
    <<: *service_env
    build:
      context: .
      dockerfile: python_rag/services/hawki_indexer_worker/Dockerfile
      args:
        TORCH_VARIANT: cpu
    image: hawki-rag-indexer-worker:local
    pull_policy: never
    container_name: hawki_rag_indexer_worker
    user: "10001:10001"
    volumes:
      - shared_storage:/shared
    group_add:
      - "${PGID}"
    depends_on:
      hawki_rag_migrator:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      hawki_rag_app:
        condition: service_started
      qdrant:
        condition: service_started
      hawki_rag_neo4j:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  # -------------------------------------------------
  # Ollama
  # -------------------------------------------------
  ollama:
    <<: *ollama_base
    image: ollama/ollama:0.32.1
    pull_policy: always
    container_name: hawki_ollama

  # -------------------------------------------------
  # Optional OpenAI-compatible LiteLLM gateway
  # -------------------------------------------------
  litellm:
    <<: *service_env
    profiles: ["litellm"]
    image: ${LITELLM_IMAGE}
    container_name: hawki_litellm
    command: ["--config=/app/config.yaml", "--port=4000"]
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT}:4000"
    networks:
      - default
      - hawki-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  shared_storage:
    name: rawki_shared_storage
  qdrant_data:
  neo4j_data:
  hawki_postgres_data:
  ollama:

networks:
  hawki-network:
    name: hawki-network
    external: true
  hosting_network:
    driver: bridge
    external: true
