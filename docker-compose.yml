x-ollama-base: &ollama_base
    build:
        context: .
        dockerfile: docker/ollama.Dockerfile
    image: hawki-ollama:local
    container_name: hawki_ollama
    ports:
        - "11434:11434"
    volumes:
        - ollama:/root/.ollama
    networks:
        hawki-network:
            aliases:
                - ollama
    restart: unless-stopped
    healthcheck:
        test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
        interval: 20s
        timeout: 5s
        retries: 10
        start_period: 20s

services:
    # -------------------------------------------------
    # Laravel Application
    # -------------------------------------------------
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: laravel-app
        container_name: hawki_app
        volumes:
            - .:/var/www
            # Shared volume with crawler (Laravel public storage)
            - shared_storage:/var/www/storage/app/public
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            # Redis Configuration
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: "foobared"
            REDIS_DB: 0
            # RabbitMQ Configuration
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USER: ${RABBITMQ_USER:-admin}
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
            RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
            RABBITMQ_EXCHANGE: scrape_events
            RABBITMQ_EXCHANGE_TYPE: topic
            RABBITMQ_SCRAPE_QUEUE: scrape-events
            # Communication Service Configuration
            COMMUNICATION_SERVICE: ${COMMUNICATION_SERVICE:-rabbitmq}
            REDIS_SCRAPE_CHANNEL: scrape-events
        networks:
            - hawki-network
        depends_on:
            rabbitmq:
                condition: service_healthy
            crawler:
                condition: service_healthy

    # -------------------------------------------------
    # NGINX Reverse Proxy
    # -------------------------------------------------
    nginx:
        image: nginx:1.27-alpine
        container_name: rawki_nginx
        ports:
            - "8080:80"
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www
            - ./:/var/www/html
            - ./public:/var/www/html/public
            - ./storage/app/public:/var/www/html/storage
        depends_on:
            - app
        networks:
            - hawki-network

    # -------------------------------------------------
    # Redis (Pub/Sub for Laravel <-> Crawler)
    # -------------------------------------------------
    # redis:
    #     image: redis:7-alpine
    #     container_name: rawki_redis
    #     ports:
    #         - "6379:6379"
    #     volumes:
    #         - redis_data:/data
    #     networks:
    #         - hawki-network
    #     restart: unless-stopped
    #     command: redis-server --appendonly yes --requirepass foobared
    #     healthcheck:
    #         test: ["CMD", "redis-cli", "-a", "foobared", "ping"]
    #         interval: 10s
    #         timeout: 3s
    #         retries: 5

    # -------------------------------------------------
    # RabbitMQ (Message Queue for Laravel <-> Microservices)
    # -------------------------------------------------
    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        container_name: rawki_rabbitmq
        ports:
            - "5672:5672"   # AMQP protocol port
            - "15672:15672" # Management UI port
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
            RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
            RABBITMQ_PLUGINS: rabbitmq_management,rabbitmq_prometheus
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - rabbitmq_logs:/var/log/rabbitmq
        networks:
            - hawki-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s

    # -------------------------------------------------
    # External Crawler Microservice
    # -------------------------------------------------
    crawler:
        image: crawl4ai-fastapi:latest
        container_name: crawl4ai-service
        ports:
            - "8004:8000"
        environment:
            # Optional API security token
            - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}
            # Maximum concurrent crawl tasks
            - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-5}
            # Server configuration
            - HOST=${HOST:-0.0.0.0}
            - PORT=${PORT:-8000}
            # Optional LLM Provider Keys (for advanced crawl4ai features)
            - OPENAI_API_KEY=${OPENAI_API_KEY:-}
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
            # Communication Configuration
            - COMMUNICATION_METHOD=rabbitmq
            # Redis Pub/Sub Configuration (disabled)
            - REDIS_ENABLED=false
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_DB=0
            - REDIS_PASSWORD=foobared
            - REDIS_CHANNEL=scrape-events
            # RabbitMQ Configuration (enabled)
            - RABBITMQ_ENABLED=true
            - RABBITMQ_HOST=rabbitmq
            - RABBITMQ_PORT=5672
            - RABBITMQ_USER=${RABBITMQ_USER:-admin}
            - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin123}
            - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
            - RABBITMQ_EXCHANGE=scrape_events
            - RABBITMQ_QUEUE=scrape-events
            # WebSocket URL for real-time events (legacy, deprecated)
            - WEBSOCKET_URL=${WEBSOCKET_URL:-}
            # Data storage path for job files
            - DATA_PATH=${DATA_PATH:-/app/shared}
        volumes:
            # Mount data directory for job-specific storage (new structure)
            - ./data:/app/data
            # Mount output directory for backwards compatibility
            - ./output:/app/output
            # Shared memory for Playwright (prevents crashes)
            - /dev/shm:/dev/shm
            - shared_storage:/app/shared
        networks:
            - hawki-network
        depends_on:
            - rabbitmq
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    # -------------------------------------------------
    # Qdrant Vector DB
    # -------------------------------------------------
    qdrant:
        build:
            context: .
            dockerfile: docker/qdrant.Dockerfile
        image: hawki-qdrant:local
        container_name: hawki_qdrant
        ports:
            - "6333:6333"
            - "6334:6334"
        volumes:
            - qdrant_data:/qdrant/storage
        networks:
            - hawki-network
        restart: always
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:6333/readyz"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s

    # -------------------------------------------------
    # Neo4j Graph DB
    # -------------------------------------------------
    neo4j:
        image: neo4j:5.22
        container_name: rawki_neo4j
        ports:
            - "7475:7474"
            - "7688:7687"
        environment:
            - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-ixdlabPass123}
        volumes:
            - neo4j_data:/data
        networks:
            - hawki-network
        restart: always
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474/browser"]
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 20s

    # -------------------------------------------------
    # LightRAG core UI/API
    # -------------------------------------------------
    rawki_core:
        build:
            context: .
            dockerfile: Dockerfile
            target: lightrag-core
        container_name: rawki_core
        env_file:
            - ./python_rag/LightRAG.env
        volumes:
            - ../hawki-data/crawled-data:/data/crawled:ro
        networks:
            - hawki-network
        depends_on:
            neo4j:
                condition: service_healthy
        restart: unless-stopped
        ports:
            - "8006:9621"
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:9621/health"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s

    # -------------------------------------------------
    # Cohere-compatible reranker (used by LightRAG)
    # -------------------------------------------------
    rawki_rerank:
        build:
            context: .
            dockerfile: Dockerfile
            target: rerank
        container_name: rawki_rerank
        networks:
            hawki-network:
                aliases:
                    - lightrag_rerank
        restart: unless-stopped
        ports:
            - "8008:8000"
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s

    # -------------------------------------------------
    # RAG-Anything + LightRAG API (FastAPI)
    # -------------------------------------------------
    raganything_api:
        build:
            context: .
            dockerfile: Dockerfile
            target: python-rag
        image: rawki-python-rag:local
        container_name: raganything_api
        profiles: ["cpu"]
        environment:
            - RAG_WORKING_DIR=/app/rag_storage
            - OLLAMA_URL=http://ollama:11434
            - QDRANT_URL=http://qdrant:6333
            - NEO4J_URI=bolt://neo4j:7687
        volumes:
            - rag_storage:/app/rag_storage
        networks:
            - hawki-network
        depends_on:
            - ollama_cpu
            - qdrant
            - neo4j
        restart: unless-stopped
        ports:
            - "8003:8003"

    # -------------------------------------------------
    # FastAPI bridge (Python RAG API)
    # -------------------------------------------------
    rawki_bridge:
        image: rawki-python-rag:local
        container_name: rawki_bridge
        env_file:
            - ./python_rag/LightRAG.env
        environment:
            - QDRANT_HOST=qdrant
            - QDRANT_PORT=6333
            - QDRANT_COLLECTION=embeddings_hawk
            - NEO4J_URI=bolt://neo4j:7687
            - NEO4J_USER=${NEO4J_USER:-neo4j}
        volumes:
            - ./python_rag:/app
            - ./public:/app/public
        networks:
            - hawki-network
        depends_on:
            - neo4j
        restart: unless-stopped
        command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
        ports:
            - "8009:8000"

    # -------------------------------------------------
    # Ollama (local models for LLM/embeddings)
    # -------------------------------------------------
    ollama_cpu:
        <<: *ollama_base
        profiles: ["cpu"]

    # Optional GPU variants (enable with COMPOSE_PROFILES=gpu)
    raganything_api_gpu:
        build:
            context: .
            dockerfile: Dockerfile
            target: python-rag
        image: rawki-python-rag:local
        container_name: raganything_api_gpu
        profiles: ["gpu"]
        environment:
            - RAG_WORKING_DIR=/app/rag_storage
            - OLLAMA_URL=http://ollama:11434
            - QDRANT_URL=http://qdrant:6333
            - NEO4J_URI=bolt://neo4j:7687
        volumes:
            - rag_storage:/app/rag_storage
        networks:
            - hawki-network
        depends_on:
            - ollama_gpu
            - qdrant
            - neo4j
        restart: unless-stopped
        ports:
            - "8003:8003"
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities:
                            - gpu

    ollama_gpu:
        <<: *ollama_base
        profiles: ["gpu"]
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities:
                            - gpu
    # MinIO Object Storage (disabled)
    # minio:
    #     image: minio/minio
    #     container_name: hawki_minio
    #     ports:
    #     - "9000:9000"
    #     - "9001:9001"
    #     environment:
    #         MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
    #         MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    #     volumes:
    #     - minio_data:/data
    #     networks:
    #     - hawki-network
    #     command: server --console-address ":9001" /data
    #     restart: always
    # NOTE: All RAWKI services are defined in this single compose file.

volumes:
    shared_storage:     # Shared Laravel storage <-> Crawler
    redis_data:
    rabbitmq_data:      # RabbitMQ persistent data
    rabbitmq_logs:      # RabbitMQ logs
    qdrant_data:
    neo4j_data:
    ollama:
    rag_storage:

networks:
    hawki-network:
        external: true
