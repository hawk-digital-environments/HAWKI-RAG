version: "3.9"

x-ollama-base: &ollama_base
  build:
    context: .
    dockerfile: docker/ollama.Dockerfile
  image: hawki-ollama:cuda
  pull_policy: never
  volumes:
    - ollama:/root/.ollama
    - ./scripts/gpu_guard.sh:/usr/local/bin/gpu_guard.sh:ro
  entrypoint: ["/usr/local/bin/gpu_guard.sh", "ollama"]
  command: ["serve"]
  environment:
    GPU_MIN_FREE_MB: ${GPU_MIN_FREE_MB:-4096}
  networks:
    hawki-network:
      aliases:
        - ollama
        - hawki_ollama
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
    interval: 20s
    timeout: 5s
    retries: 10
    start_period: 20s

x-gpu: &gpu
  gpus: all

services:
  # -------------------------------------------------
  # Laravel Application
  # -------------------------------------------------
  hawki_rag_app:
    <<: *gpu
    build:
      context: .
      dockerfile: Dockerfile
      target: laravel-app
    container_name: hawki_rag_app
    volumes:
      - .:/var/www
      - shared_storage:/var/www/storage/app/public
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: hawki_rag_rabbitmq
      RABBITMQ_PORT: 5672
    networks:
      - hawki-network
    depends_on:
      hawki_rag_rabbitmq:
        condition: service_healthy

  # -------------------------------------------------
  # NGINX Reverse Proxy
  # -------------------------------------------------
  hawki_rag_nginx:
    <<: *gpu
    image: nginx:1.27-alpine
    container_name: hawki_rag_nginx
    ports:
      - "8080:80" # the only public port
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www
      - ./public:/var/www/html/public
      - ./storage/app/public:/var/www/html/storage
    environment:
        VIRTUAL_HOST: ixdlab.hawk.de
        VIRTUAL_PATH: /hawki-rag/
        VIRTUAL_DEST: /
        # VIRTUAL_PORT: 8080
    depends_on:
      - hawki_rag_app
    networks:
      - hawki-network
      - hosting_network
  # -------------------------------------------------
  # MariaDB Database for Laravel
  # -------------------------------------------------
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 17apples4Vincent
      MYSQL_DATABASE: rag_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root

      TZ: Europe/Berlin
    ports:
      - "3306:3306"
    volumes:
      - hawki_mariadb_data:/var/lib/mysql
    networks:
      - hawki-network
    logging:
      options:
        max-size: "128m"
        max-file: "3"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8004}:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 1024M
      TZ: Europe/Berlin
      VIRTUAL_HOST: ixdlab.hawk.de
      VIRTUAL_PATH: /phpmyadmin/
      VIRTUAL_DEST: /
    networks:
      - hawki-network
      - hosting_network
  # -------------------------------------------------
  # RabbitMQ (Message Queue for Laravel <-> Microservices)
  # -------------------------------------------------
  hawki_rag_rabbitmq:
    <<: *gpu
    image: rabbitmq:3.13-management-alpine
    container_name: hawki_rag_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    networks:
      - hawki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------------------------------
  # Qdrant Vector DB
  # -------------------------------------------------
  qdrant:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/qdrant.Dockerfile
    image: hawki-qdrant:local
    pull_policy: never
    container_name: hawki_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - hawki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # ports:
    #   - "6333:6333"
    #   - "6334:6334" # Qdrant gRPC port (optional, for advanced use cases)
  # -------------------------------------------------
  # Neo4j Graph DB
  # -------------------------------------------------
  hawki_rag_neo4j:
    <<: *gpu
    image: neo4j:5.22
    container_name: hawki_rag_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    networks:
      - hawki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474/browser"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # Cohere-compatible reranker (used by HAWKI RAG)
  # -------------------------------------------------
  hawki_rag_rerank:
    <<: *gpu
    build:
      context: .
      dockerfile: Dockerfile
      target: rerank
    image: hawki-rag-rerank:local
    pull_policy: never
    container_name: hawki_rag_rerank
    networks:
      - hawki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # FastAPI bridge (Python RAG API)
  # -------------------------------------------------
  hawki_rag_bridge:
    <<: *gpu
    build:
      context: .
      dockerfile: Dockerfile
      target: python-rag
    image: hawki-rag-python:local
    pull_policy: never
    container_name: hawki_rag_bridge
    env_file:
      - ./.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://hawki_rag_neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      KG_MAX_GLEANING: "1"
      GRAPH_OLLAMA_RAG_MODEL: ${GRAPH_OLLAMA_RAG_MODEL:-llama3.2:3b}
      OLLAMA_CHAT_TIMEOUT: ${OLLAMA_CHAT_TIMEOUT:-60}
      GRAPH_PERF_LOG: "1"
    volumes:
      - ./python_rag:/app
      - shared_storage:/app/shared
    networks:
      - hawki-network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # -------------------------------------------------
  # Ollama (CPU)
  # -------------------------------------------------
  ollama_cpu:
    <<: [*ollama_base, *gpu]
    container_name: hawki_ollama_cpu
    profiles: ["cpu"]

  # -------------------------------------------------
  # RAG-Anything API (GPU)
  # -------------------------------------------------
  raganything_api_gpu:
    <<: *gpu
    image: hawki-rag-python:local
    pull_policy: never
    container_name: raganything_api_gpu
    profiles: ["gpu"]
    env_file:
      - ./.env
    environment:
      RAG_WORKING_DIR: /app/rag_storage
      OLLAMA_URL: http://ollama_gpu:11434
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://hawki_rag_neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      GPU_MIN_FREE_MB: ${GPU_MIN_FREE_MB:-4096}
    volumes:
      - ./python_rag:/app
      - rag_storage:/app/rag_storage
      - ./scripts/gpu_guard.sh:/usr/local/bin/gpu_guard.sh:ro
    networks:
      - hawki-network
    command: ["/usr/local/bin/gpu_guard.sh", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003"]
    depends_on:
      - ollama_gpu
      - qdrant
      - hawki_rag_neo4j
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  # -------------------------------------------------
  # Ollama (GPU)
  # -------------------------------------------------
  ollama_gpu:
    <<: [*ollama_base, *gpu]
    container_name: hawki_ollama_gpu
    profiles: ["gpu"]
    environment:
      OLLAMA_NUM_GPU: ${OLLAMA_NUM_GPU:-1}
      OLLAMA_GPU_LAYERS: ${OLLAMA_GPU_LAYERS:-999}
      OLLAMA_LLM_LIBRARY: cuda
      OLLAMA_MMAP: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

volumes:
  shared_storage:
    name: rawki_shared_storage
  redis_data:
  rabbitmq_data:
  rabbitmq_logs:
  qdrant_data:
  neo4j_data:
  hawki_mariadb_data:
  ollama:
  rag_storage:

networks:
  hawki-network:
    name: hawki-network
    external: true
  hosting_network:
    driver: bridge
