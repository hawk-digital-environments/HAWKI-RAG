x-ollama-base: &ollama_base
  volumes:
    - ollama:/root/.ollama
    - ./scripts/gpu_guard.sh:/usr/local/bin/gpu_guard.sh:ro
  entrypoint: ["/usr/local/bin/gpu_guard.sh", "ollama"]
  command: ["serve"]
  environment:
    GPU_MIN_FREE_MB: ${GPU_MIN_FREE_MB:-4096}
  networks:
    default: {}
    hawki-network:
      aliases:
        - ollama
        - hawki_ollama
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 20s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  # -------------------------------------------------
  # Laravel Application
  # -------------------------------------------------
  hawki_rag_app:
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
      target: laravel-app
      args:
        - DOCKER_PROJECT_HOST=ixdlab.hawk.de
        - DOCKER_PROJECT_PATH=/hawki-rag/
    container_name: hawki_rag_app
    volumes:
      - shared_storage:/app/shared
      - shared_storage:/shared
      - ./storage:/var/www/html/storage
      - ./docker/rag_app:/container/custom
      - ./:/var/www/html
    env_file:
      - ./.env
    environment:
      # ENVIRONMENT: 'development' # 'dev' or 'prod'
      # PHP_PROD_DEBUG: "true" # If you want to stay in prod mode, but need to live edit files
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      VIRTUAL_HOST: ixdlab.hawk.de
      VIRTUAL_PATH: /hawki-rag/
      VIRTUAL_DEST: /
      ENVIRONMENT: "development"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      TEMPORAL_ADDRESS: temporal:7233
      # Laravel validates individual uploads at 100 MiB. The HTTP transport
      # needs headroom for multipart form metadata around the uploaded file.
      NGINX_CLIENT_MAX_BODY_SIZE: 128M
      PHP_POST_MAX_SIZE: 128M
      PHP_UPLOAD_MAX_FILESIZE: 128M
    networks:
      - hawki-network
      - hosting_network
      - default
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  # -------------------------------------------------
  # PostgreSQL for Laravel metadata and Temporal persistence
  # -------------------------------------------------
  postgres:
    image: postgres:16
    container_name: hawki_rag_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hawki_rag}
      POSTGRES_USER: ${DB_USERNAME:-rag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      TZ: Europe/Berlin
    ports:
      - "5432:5432"
    volumes:
      - hawki_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rag_user} -d ${DB_DATABASE:-hawki_rag}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      options:
        max-size: "128m"
        max-file: "3"

  # -------------------------------------------------
  # Temporal Server and UI
  # -------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${DB_USERNAME:-rag_user}
      POSTGRES_PWD: ${DB_PASSWORD:-change_me}
      POSTGRES_SEEDS: postgres
      TEMPORAL_ADDRESS: temporal:7233
      BIND_ON_IP: 0.0.0.0
      DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - hawki-network

  # Optional Temporal UI for local diagnostics. Uncomment this service block
  # when the browser-based workflow inspector is needed.
  # temporal-ui:
  #   profiles: ["devtools"]
  #   image: temporalio/ui:2.34.0
  #   container_name: temporal_ui
  #   restart: unless-stopped
  #   environment:
  #     TEMPORAL_ADDRESS: temporal:7233
  #     TEMPORAL_CORS_ORIGINS: http://localhost:8080
  #   ports:
  #     - "${TEMPORAL_UI_PORT:-8081}:8080"
  #   depends_on:
  #     temporal:
  #       condition: service_started
  #   networks:
  #     - default
  #     - hawki-network

  # -------------------------------------------------
  # Qdrant Vector DB
  # -------------------------------------------------
  qdrant:
    build:
      context: .
      dockerfile: docker/qdrant.Dockerfile
    image: hawki-qdrant:local
    pull_policy: never
    container_name: hawki_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # ports:
    #   - "6333:6333"
    #   - "6334:6334" # Qdrant gRPC port (optional, for advanced use cases)
  # -------------------------------------------------
  # Neo4j Graph DB
  # -------------------------------------------------
  hawki_rag_neo4j:
    image: neo4j:5.22
    container_name: hawki_rag_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474/browser"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # Cohere-compatible reranker (used by HAWKI RAG)
  # -------------------------------------------------
  hawki_rag_rerank:
    build:
      context: .
      dockerfile: Dockerfile
      target: rerank
    image: hawki-rag-rerank:local
    pull_policy: never
    container_name: hawki_rag_rerank
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # FastAPI bridge (Python RAG API)
  # -------------------------------------------------
  hawki-rag-shared-storage-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-rag
    image: hawki-rag-python:local
    pull_policy: never
    user: "0:0"
    environment:
      HAWKI_RAG_SHARED_STORAGE_INIT: "1"
      PIPELINE_SHARED_STORAGE_GID: ${PGID:-1000}
    volumes:
      - shared_storage:/shared
    command: ["true"]
    restart: "no"

  hawki_rag_bridge:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-rag
    image: hawki-rag-python:local
    pull_policy: never
    container_name: hawki_rag_bridge
    user: "10001:10001"
    env_file:
      - ./.env
    environment:
      PIPELINE_SHARED_STORAGE_GID: ${PGID:-1000}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://hawki_rag_neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      KG_MAX_GLEANING: "1"
      GRAPH_OLLAMA_RAG_MODEL: ${GRAPH_OLLAMA_RAG_MODEL:-llama3.1:8b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      OLLAMA_CHAT_TIMEOUT: ${OLLAMA_CHAT_TIMEOUT:-60}
      GRAPH_PERF_LOG: "1"
      HAWKI_RAG_PUBLIC_DIR: /app/public
    volumes:
      - ./python_rag:/app
      - ./public:/app/public
      - shared_storage:/app/shared
      - shared_storage:/shared
    group_add:
      - "${PGID:-1000}"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      hawki-rag-shared-storage-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------
  # Python Temporal workers
  # -------------------------------------------------
  hawki-rag-temporal-workflow-worker:
    image: hawki-rag-python:local
    pull_policy: never
    container_name: hawki_rag_temporal_workflow_worker
    user: "10001:10001"
    env_file:
      - ./.env
    environment:
      PIPELINE_SHARED_STORAGE_GID: ${PGID:-1000}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./python_rag:/app
      - shared_storage:/shared
    group_add:
      - "${PGID:-1000}"
    command: ["python", "-m", "temporal_rag.worker_workflow"]
    depends_on:
      hawki-rag-shared-storage-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  hawki-rag-temporal-scraper-worker:
    image: hawki-rag-python:local
    pull_policy: never
    container_name: hawki_rag_temporal_scraper_worker
    user: "10001:10001"
    env_file:
      - ./.env
    environment:
      PIPELINE_SHARED_STORAGE_GID: ${PGID:-1000}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      HAWKI_RAG_TEMPORAL_SCRAPER_LOG_PATH: /shared/logs/scraper_worker.log
    volumes:
      - ./python_rag:/app
      - shared_storage:/shared
    group_add:
      - "${PGID:-1000}"
    command: ["python", "-m", "temporal_rag.worker_scraper"]
    depends_on:
      hawki-rag-shared-storage-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  hawki-rag-temporal-converter-worker:
    image: hawki-rag-python:local
    pull_policy: never
    container_name: hawki_rag_temporal_converter_worker
    user: "10001:10001"
    env_file:
      - ./.env
    environment:
      PIPELINE_SHARED_STORAGE_GID: ${PGID:-1000}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      HAWKI_RAG_TEMPORAL_CONVERTER_LOG_PATH: /shared/logs/converter_worker.log
    volumes:
      - ./python_rag:/app
      - shared_storage:/shared
    group_add:
      - "${PGID:-1000}"
    command: ["python", "-m", "temporal_rag.worker_converter"]
    depends_on:
      hawki-rag-shared-storage-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  hawki-rag-temporal-ingestion-worker:
    image: hawki-rag-python:local
    pull_policy: never
    container_name: hawki_rag_temporal_ingestion_worker
    user: "10001:10001"
    env_file:
      - ./.env
    environment:
      PIPELINE_SHARED_STORAGE_GID: ${PGID:-1000}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://hawki_rag_neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      HAWKI_RAG_TEMPORAL_INGESTION_LOG_PATH: /shared/logs/ingestion_worker.log
    volumes:
      - ./python_rag:/app
      - ./public:/app/public
      - shared_storage:/shared
    group_add:
      - "${PGID:-1000}"
    command: ["python", "-m", "temporal_rag.worker_ingestion"]
    depends_on:
      hawki-rag-shared-storage-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
      hawki_rag_bridge:
        condition: service_started
      qdrant:
        condition: service_started
      hawki_rag_neo4j:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - hawki-network

  # -------------------------------------------------
  # Ollama
  # -------------------------------------------------
  ollama:
    <<: *ollama_base
    image: ollama/ollama:0.32.1
    pull_policy: always
    container_name: hawki_ollama

  # -------------------------------------------------
  # Optional OpenAI-compatible LiteLLM gateway
  # -------------------------------------------------
  litellm:
    profiles: ["litellm"]
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:main-stable}
    container_name: hawki_litellm
    command: ["--config=/app/config.yaml", "--port=4000"]
    environment:
      LITELLM_OLLAMA_API_BASE: ${LITELLM_OLLAMA_API_BASE:-http://hawki_ollama:11434}
      LITELLM_OLLAMA_CHAT_MODEL: ${LITELLM_OLLAMA_CHAT_MODEL:-ollama_chat/llama3.1:8b}
      LITELLM_OLLAMA_EMBED_MODEL: ${LITELLM_OLLAMA_EMBED_MODEL:-ollama/bge-m3}
      LITELLM_OLLAMA_VISION_MODEL: ${LITELLM_OLLAMA_VISION_MODEL:-ollama_chat/qwen2.5vl:7b}
      LITELLM_OPENAI_API_BASE: ${LITELLM_OPENAI_API_BASE:-https://api.openai.com/v1}
      LITELLM_OPENAI_CHAT_MODEL: ${LITELLM_OPENAI_CHAT_MODEL:-openai/gpt-4.1-mini}
      LITELLM_OPENAI_EMBED_MODEL: ${LITELLM_OPENAI_EMBED_MODEL:-openai/text-embedding-3-small}
      LITELLM_OPENAI_VISION_MODEL: ${LITELLM_OPENAI_VISION_MODEL:-openai/gpt-4.1-mini}
      LITELLM_ANTHROPIC_API_BASE: ${LITELLM_ANTHROPIC_API_BASE:-https://api.anthropic.com}
      LITELLM_ANTHROPIC_CHAT_MODEL: ${LITELLM_ANTHROPIC_CHAT_MODEL:-anthropic/claude-sonnet-4-5-20250929}
      LITELLM_ANTHROPIC_VISION_MODEL: ${LITELLM_ANTHROPIC_VISION_MODEL:-anthropic/claude-sonnet-4-5-20250929}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    networks:
      - default
      - hawki-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------
  # RAG-Anything API (GPU)
  # -------------------------------------------------
  raganything_api_gpu:
    image: hawki-rag-python:local
    pull_policy: never
    container_name: raganything_api_gpu
    profiles: ["gpu"]
    env_file:
      - ./.env
    environment:
      RAG_WORKING_DIR: /app/rag_storage
      OLLAMA_URL: http://ollama:11434
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://hawki_rag_neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      GPU_MIN_FREE_MB: ${GPU_MIN_FREE_MB:-4096}
    volumes:
      - ./python_rag:/app
      - rag_storage:/app/rag_storage
      - ./scripts/gpu_guard.sh:/usr/local/bin/gpu_guard.sh:ro
    command: ["/usr/local/bin/gpu_guard.sh", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8003"]
    depends_on:
      - ollama
      - qdrant
      - hawki_rag_neo4j
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

volumes:
  shared_storage:
    name: rawki_shared_storage
  qdrant_data:
  neo4j_data:
  hawki_postgres_data:
  ollama:
  rag_storage:

networks:
  hawki-network:
    name: hawki-network
    external: true
  hosting_network:
    driver: bridge
    external: true
