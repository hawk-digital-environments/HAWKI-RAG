x-service-env: &service_env
  env_file:
    - &project_env ${RAG_COMPOSE_ENV_FILE:-.env}

x-ollama-base: &ollama_base
  <<: *service_env
  volumes:
    - ollama:/root/.ollama
    - ./scripts/gpu_guard.sh:/usr/local/bin/gpu_guard.sh:ro
  entrypoint: ["/usr/local/bin/gpu_guard.sh", "ollama"]
  command: ["serve"]
  networks:
    default: {}
    hawki-network:
      aliases:
        - ollama
        - hawki_ollama
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 20s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  # -------------------------------------------------
  # PostgreSQL: Python operational schema, frozen public history and Temporal
  # -------------------------------------------------
  postgres:
    <<: *service_env
    image: postgres:16
    container_name: hawki_rag_postgres
    restart: always
    volumes:
      - hawki_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      options:
        max-size: "128m"
        max-file: "3"

  # -------------------------------------------------
  # Temporal Server
  # -------------------------------------------------
  temporal:
    <<: *service_env
    image: temporalio/auto-setup:1.25.2
    container_name: temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------
  # Qdrant Vector DB
  # -------------------------------------------------
  qdrant:
    build:
      context: .
      dockerfile: docker/qdrant.Dockerfile
    image: hawki-qdrant:local
    pull_policy: never
    container_name: hawki_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # ports:
    #   - "6333:6333"
    #   - "6334:6334" # Qdrant gRPC port (optional, for advanced use cases)
  # -------------------------------------------------
  # Neo4j Graph DB
  # -------------------------------------------------
  neo4j:
    <<: *service_env
    image: neo4j:5.22
    container_name: neo4j
    # Neo4j converts every NEO4J_* variable into a server setting. Use a
    # filtered adapter file so client variables such as NEO4J_HTTP_URL and
    # NEO4J_URI are not interpreted as invalid Neo4j configuration keys.
    env_file:
      - docker/env/neo4j.env
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474/browser"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # Cohere-compatible reranker (used by HAWKI RAG)
  # -------------------------------------------------
  rag_reranker:
    build:
      context: .
      dockerfile: python_rag/Dockerfile
      target: reranker-runtime
      args:
        TORCH_VARIANT: cpu
    image: hawki-rag-reranker:local
    pull_policy: never
    container_name: rag_reranker
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # Authenticated public query backend
  #
  # FastAPI owns new traffic. Schema/role and issuer readiness remain mandatory.
  # Service JWT validation and signed Python callbacks are mandatory.
  # -------------------------------------------------
  rag_backend:
    <<: *service_env
    build:
      context: .
      dockerfile: python_backend/Dockerfile
    image: hawki-backend:local
    pull_policy: never
    env_file:
      - *project_env
      - ./docker/env/worker-callback.env
      - ./docker/env/backend.env
    container_name: rag_backend
    volumes:
      - shared_storage:/shared
    group_add:
      - "${PGID}"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-m", "hawki_backend.readiness", "--live"]
      interval: 15s
      timeout: 45s
      retries: 10
      start_period: 20s

  # -------------------------------------------------
  # Python Temporal workers send signed callbacks directly to Python.
  # -------------------------------------------------
  workflow_worker:
    <<: *service_env
    build:
      context: .
      dockerfile: python_rag/Dockerfile
      target: workflow-runtime
    image: hawki-rag-workflow-worker:local
    pull_policy: never
    depends_on:
      temporal:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - default
      - hawki-network

  scraper_worker:
    <<: *service_env
    env_file:
      - *project_env
      - ./docker/env/worker-callback.env
    build:
      context: .
      dockerfile: python_rag/Dockerfile
      target: scraper-runtime
    image: hawki-rag-scraper-worker:local
    pull_policy: never
    volumes:
      - shared_storage:/shared
    group_add:
      - "${PGID}"
    depends_on:
      rag_backend:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - default
      - hawki-network

  converter_worker:
    <<: *service_env
    env_file:
      - *project_env
      - ./docker/env/worker-callback.env
    build:
      context: .
      dockerfile: python_rag/Dockerfile
      target: converter-runtime
    image: hawki-rag-converter-worker:local
    pull_policy: never
    volumes:
      - shared_storage:/shared
    group_add:
      - "${PGID}"
    depends_on:
      rag_backend:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - default
      - hawki-network

  indexer_worker:
    <<: *service_env
    env_file:
      - *project_env
      - ./docker/env/worker-callback.env
    build:
      context: .
      dockerfile: python_rag/Dockerfile
      target: indexer-runtime
      args:
        TORCH_VARIANT: cpu
    image: hawki-rag-indexer-worker:local
    pull_policy: never
    volumes:
      - shared_storage:/shared
    group_add:
      - "${PGID}"
    depends_on:
      rag_backend:
        condition: service_healthy
      temporal:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - default
      - hawki-network

  # -------------------------------------------------
  # Ollama
  # -------------------------------------------------
  ollama:
    <<: *ollama_base
    image: ollama/ollama:0.32.1
    pull_policy: always
    container_name: hawki_ollama

  # -------------------------------------------------
  # Optional OpenAI-compatible LiteLLM gateway
  # -------------------------------------------------
  litellm:
    <<: *service_env
    profiles: ["litellm"]
    image: ${LITELLM_IMAGE}
    container_name: hawki_litellm
    command: ["--config=/app/config.yaml", "--port=4000"]
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT}:4000"
    networks:
      - default
      - hawki-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  shared_storage:
    name: rawki_shared_storage
  qdrant_data:
  neo4j_data:
  hawki_postgres_data:
  ollama:

networks:
  hawki-network:
    name: hawki-network
    external: true
