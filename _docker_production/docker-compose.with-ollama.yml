# Add after docker-compose.yml. Include .env.ollama for server settings.
# Set the dataset embedding provider and query model registry in .env.
services:
    ollama:
        container_name: hawki_ollama
        image: ollama/ollama:0.40.13
        pull_policy: always
        env_file:
            - ./env/ollama.env
        volumes:
            - ollama:/root/.ollama
            - type: bind
              source: ./ollama/ollama-entrypoint.sh
              target: /usr/local/bin/ollama-entrypoint.sh
              read_only: true
              bind:
                  create_host_path: false
        entrypoint: ["/usr/local/bin/ollama-entrypoint.sh"]
        command: ["serve"]
        restart: always
        healthcheck:
            test: ["CMD", "ollama", "list"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 30s

    rag_backend:
        env_file:
            - ./env/ollama-client.env
        depends_on:
            ollama:
                condition: service_healthy

    hawki-rag-indexer-worker:
        env_file:
            - ./env/ollama-client.env
        depends_on:
            ollama:
                condition: service_healthy

volumes:
    # Keep the existing <project>_ollama model cache.
    ollama:
