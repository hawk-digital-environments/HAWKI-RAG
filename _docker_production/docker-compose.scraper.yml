# Optional website scraper. Load after the base Compose file.
services:
    scraper:
        container_name: hawki_rag_scraper
        image: ${RAG_SCRAPER_IMAGE:-digitalenvironments/hawki-rag-scraper:latest}
        pull_policy: always
        env_file:
            - ./env/website-scraper.env
        volumes:
            - profiles_storage:/var/www/html/profiles
            - tasks_storage:/var/www/html/tasks
            - output_storage:/var/www/html/output
            - ./scraper/forbidden_urls.txt:/var/www/html/forbidden_urls.txt:ro
            - shared_storage:/var/www/html/shared
        shm_size: 1gb
        networks:
            - crawler
        restart: always
        stop_grace_period: 60s
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1/80/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        deploy:
            resources:
                limits:
                    cpus: '2'
                    memory: 8G
                reservations:
                    cpus: '1'
                    memory: 1G
        logging:
            options:
                max-size: "128m"
                max-file: "3"

    # Only the Temporal scraper worker needs access to the crawler network.
    hawki-rag-temporal-scraper-worker:
        env_file:
            - ./env/website-scraper-client.env
        networks:
            - default
            - crawler

volumes:
    profiles_storage:
    tasks_storage:
    output_storage:

networks:
    crawler:
