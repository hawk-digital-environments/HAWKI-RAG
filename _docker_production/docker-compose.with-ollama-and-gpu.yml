# Include after docker-compose.yml and docker-compose.with-ollama.yml.
# Requires the NVIDIA Container Toolkit and the matching Python release's
# CUDA images. The historical tag names correspond to TORCH_VARIANT=gpu.
x-nvidia: &nvidia
    resources:
        reservations:
            devices:
                - driver: nvidia
                  count: 1
                  capabilities: [gpu]

services:
    rag_reranker:
        image: ${RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:rerank-gpu-${RAG_VERSION:?Set the Python production release version}
        deploy: *nvidia

    hawki-rag-indexer-worker:
        image: ${RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:indexer-worker-gpu-${RAG_VERSION:?Set the Python production release version}
        deploy: *nvidia

    ollama:
        env_file:
            - ./env/ollama-gpu.env
        deploy: *nvidia
