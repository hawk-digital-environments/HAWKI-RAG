# Standalone, pull-only production model. Add service overlays with -f (base
# first) or COMPOSE_FILE. Keep the existing Compose project name on upgrades.
# See .env.example for the release, schema, and credential prerequisites.
x-shared-storage: &shared_storage
    volumes:
        - shared_storage:/shared
    group_add:
        - "${PGID:-33}"

x-worker: &worker
    pull_policy: always
    restart: always
    stop_grace_period: 15s

services:
    postgres:
        container_name: hawki_rag_postgres
        image: postgres:16
        restart: always
        env_file:
            - ./env/postgres.env
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 15s
        logging:
            options:
                max-size: "128m"
                max-file: "3"

    temporal:
        container_name: temporal
        image: temporalio/auto-setup:1.25.2
        restart: always
        env_file:
            - ./env/temporal.env
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", 'temporal operator namespace describe --address 127.0.0.1:7233 --namespace "$${DEFAULT_NAMESPACE}" >/dev/null']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s

    qdrant:
        container_name: hawki_qdrant
        image: qdrant/qdrant:v1.19.2
        restart: always
        env_file:
            - ./env/qdrant.env
        volumes:
            - qdrant_data:/qdrant/storage
        # The official Debian image has bash but no curl. Read only the HTTP
        # status line so an error response body cannot satisfy the probe.
        healthcheck:
            test:
                - CMD
                - bash
                - -ec
                - >-
                    exec 3<>/dev/tcp/127.0.0.1/6333;
                    printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
                    read -r protocol status reason <&3;
                    [[ "$$protocol" == HTTP/* && "$$status" == 200 ]]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    neo4j:
        container_name: neo4j
        image: neo4j:5.22
        restart: always
        # Neo4j interprets NEO4J_* as server settings. Pass client settings
        # only to Python consumers.
        env_file:
            - ./env/neo4j.env
        volumes:
            - neo4j_data:/data
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7474/browser"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    file-converter:
        container_name: hawki_rag_file_converter
        image: digitalenvironments/hawki-toolkit-file-converter:3.0.1
        restart: always
        env_file:
            - ./env/file-converter.env
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    rag_reranker:
        container_name: rag_reranker
        image: ${RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:rerank-${RAG_VERSION:?Set the Python production release version}
        pull_policy: always
        env_file:
            - ./env/identity.env
            - ./env/reranker.env
        restart: always
        stop_grace_period: 40s
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=3)"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s

    rag_backend:
        <<: *shared_storage
        container_name: rag_backend
        # Current CI has no production publishing job for the backend image.
        image: ${RAG_BACKEND_IMAGE:?Set the published Python backend image reference}
        pull_policy: always
        env_file:
            - ./env/identity.env
            - ./env/temporal-client.env
            - ./env/signed-callbacks.env
            - ./env/model-stores.env
            - ./env/backend.env
        depends_on:
            postgres:
                condition: service_healthy
            qdrant:
                condition: service_healthy
            neo4j:
                condition: service_healthy
        restart: unless-stopped
        stop_grace_period: 40s
        healthcheck:
            test: ["CMD", "python", "-m", "hawki_backend.readiness", "--live"]
            interval: 15s
            timeout: 45s
            retries: 10
            start_period: 20s

    hawki-rag-temporal-workflow-worker:
        <<: *worker
        container_name: hawki_rag_temporal_workflow_worker
        image: ${RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:workflow-worker-${RAG_VERSION:?Set the Python production release version}
        env_file:
            - ./env/identity.env
            - ./env/temporal-client.env
            - ./env/workflow-worker.env
        depends_on:
            temporal:
                condition: service_healthy

    hawki-rag-temporal-scraper-worker:
        <<: [*worker, *shared_storage]
        container_name: hawki_rag_temporal_scraper_worker
        image: ${RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:scraper-worker-${RAG_VERSION:?Set the Python production release version}
        env_file:
            - ./env/identity.env
            - ./env/temporal-client.env
            - ./env/signed-callbacks.env
            - ./env/activity-worker.env
            - ./env/scraper-worker.env
        depends_on:
            rag_backend:
                condition: service_healthy
            temporal:
                condition: service_healthy

    hawki-rag-temporal-converter-worker:
        <<: [*worker, *shared_storage]
        container_name: hawki_rag_temporal_converter_worker
        image: ${RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:converter-worker-${RAG_VERSION:?Set the Python production release version}
        env_file:
            - ./env/identity.env
            - ./env/temporal-client.env
            - ./env/signed-callbacks.env
            - ./env/activity-worker.env
            - ./env/converter-worker.env
        depends_on:
            rag_backend:
                condition: service_healthy
            temporal:
                condition: service_healthy
            file-converter:
                condition: service_healthy

    hawki-rag-indexer-worker:
        <<: [*worker, *shared_storage]
        container_name: hawki_rag_indexer_worker
        image: ${RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:indexer-worker-${RAG_VERSION:?Set the Python production release version}
        env_file:
            - ./env/identity.env
            - ./env/temporal-client.env
            - ./env/signed-callbacks.env
            - ./env/activity-worker.env
            - ./env/model-stores.env
            - ./env/indexer-worker.env
        depends_on:
            rag_backend:
                condition: service_healthy
            temporal:
                condition: service_healthy
            qdrant:
                condition: service_started
            neo4j:
                condition: service_started

volumes:
    shared_storage:
        name: rawki_shared_storage
    postgres_data:
        driver: local
    qdrant_data:
        driver: local
    neo4j_data:
        driver: local
