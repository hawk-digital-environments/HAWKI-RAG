# Standalone, pull-only production model. Add service overlays with -f (base
# first) or COMPOSE_FILE. Keep the existing Compose project name on upgrades.
# See .env.example for the release, schema, credential and ingress prerequisites.
x-runtime-identity: &runtime_identity
    PUID: ${PUID:-33}
    PGID: ${PGID:-33}
    TZ: ${TZ:-Europe/Berlin}

x-temporal-client: &temporal_client
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}

x-task-queues: &task_queues
    TEMPORAL_RAG_WORKFLOW_TASK_QUEUE: &workflow_queue ${TEMPORAL_RAG_WORKFLOW_TASK_QUEUE:-rawki-python-workflow}
    TEMPORAL_RAG_SCRAPER_TASK_QUEUE: &scraper_queue ${TEMPORAL_RAG_SCRAPER_TASK_QUEUE:-rawki-python-scraper}
    TEMPORAL_RAG_CONVERTER_TASK_QUEUE: &converter_queue ${TEMPORAL_RAG_CONVERTER_TASK_QUEUE:-rawki-python-converter}
    TEMPORAL_RAG_INDEXER_TASK_QUEUE: &indexer_queue ${TEMPORAL_RAG_INDEXER_TASK_QUEUE:-${TEMPORAL_RAG_INGESTION_TASK_QUEUE:-rawki-python-indexer}}
    TEMPORAL_RAG_INGESTION_TASK_QUEUE: *indexer_queue

x-storage-client: &storage_client
    QDRANT_HTTP_URL: ${QDRANT_HTTP_URL:-http://qdrant:6333}
    QDRANT_API_KEY:
    NEO4J_URI: ${NEO4J_URI:-bolt://hawki_rag_neo4j:7687}
    NEO4J_USER: ${NEO4J_USER:-neo4j}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}

x-model-client: &model_client
    LITELLM_API_URL:
    LITELLM_API_KEY:
    LITELLM_CHAT_TIMEOUT:
    LITELLM_EMBED_TIMEOUT:
    OLLAMA_API_URL:
    OLLAMA_CHAT_TIMEOUT:
    OLLAMA_NUM_PREDICT:

x-crawler-client: &crawler_client
    EXTERNAL_SCRAPER_URL:
    EXTERNAL_SCRAPER_TOKEN:
    CUSTOM_CRAWLER_URL:
    CUSTOM_CRAWLER_API_KEY:

x-converter-client: &converter_client
    EXTERNAL_CONVERTER_URL: ${EXTERNAL_CONVERTER_URL:-${FILE_CONVERTER_BASE_URL:-http://file-converter}}
    EXTERNAL_CONVERTER_TOKEN: ${EXTERNAL_CONVERTER_TOKEN:-${FILE_CONVERTER_TOKEN:?Set FILE_CONVERTER_TOKEN}}
    EXTERNAL_CONVERTER_START_PATH: ${EXTERNAL_CONVERTER_START_PATH:-/extract}
    EXTERNAL_CONVERTER_STATUS_PATH:

x-worker-callback: &worker_callback
    HAWKI_RAG_WORKER_CALLBACK_URL: http://hawki_backend/internal/pipeline/worker-events
    HAWKI_RAG_WORKER_CALLBACK_SECRET: ${HAWKI_RAG_WORKER_CALLBACK_SECRET:?Set HAWKI_RAG_WORKER_CALLBACK_SECRET}

x-callback-worker-env: &callback_worker_env
    <<: [*runtime_identity, *temporal_client, *worker_callback]
    PIPELINE_SHARED_STORAGE_GID: ${PGID:-33}
    HAWKI_RAG_WORKER_CALLBACK_TIMEOUT_SECONDS:
    HAWKI_RAG_WORKER_CALLBACK_RETRY_ATTEMPTS:
    TEMPORAL_RAG_ACTIVITY_WORKER_THREADS:

x-worker-http: &worker_http
    TEMPORAL_RAG_HTTP_TIMEOUT_SECONDS:
    TEMPORAL_RAG_HTTP_RETRY_ATTEMPTS:
    TEMPORAL_RAG_EXTERNAL_POLL_INTERVAL_SECONDS:
    TEMPORAL_RAG_EXTERNAL_POLL_TIMEOUT_SECONDS:

x-shared-storage: &shared_storage
    volumes:
        - shared_storage:/shared
    group_add:
        - "${PGID:-33}"

x-worker: &worker
    pull_policy: always
    restart: always
    stop_grace_period: 15s

services:
    postgres:
        container_name: hawki_rag_postgres
        image: postgres:16
        restart: always
        environment:
            POSTGRES_DB: ${DB_DATABASE:-hawki_rag}
            POSTGRES_USER: ${DB_USERNAME:-rag_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
            TZ: ${TZ:-Europe/Berlin}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 15s
        logging:
            options:
                max-size: "128m"
                max-file: "3"

    temporal:
        container_name: temporal
        image: temporalio/auto-setup:1.25.2
        restart: always
        environment:
            DB: postgres12
            DB_PORT: "5432"
            POSTGRES_SEEDS: postgres
            POSTGRES_USER: ${DB_USERNAME:-rag_user}
            POSTGRES_PWD: ${DB_PASSWORD:?Set DB_PASSWORD}
            BIND_ON_IP: 0.0.0.0
            DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
            DBNAME:
            VISIBILITY_DBNAME:
            DEFAULT_NAMESPACE_RETENTION:
            SKIP_SCHEMA_SETUP:
            SKIP_DB_CREATE:
            TZ: ${TZ:-Europe/Berlin}
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", 'temporal operator namespace describe --address 127.0.0.1:7233 --namespace "$${DEFAULT_NAMESPACE}" >/dev/null']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s

    qdrant:
        container_name: hawki_qdrant
        image: qdrant/qdrant:v1.19.2
        restart: always
        environment:
            QDRANT__SERVICE__API_KEY:
        volumes:
            - qdrant_data:/qdrant/storage
        # The official Debian image has bash but no curl. Read only the HTTP
        # status line so an error response body cannot satisfy the probe.
        healthcheck:
            test:
                - CMD
                - bash
                - -ec
                - >-
                    exec 3<>/dev/tcp/127.0.0.1/6333;
                    printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
                    read -r protocol status reason <&3;
                    [[ "$$protocol" == HTTP/* && "$$status" == 200 ]]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    hawki_rag_neo4j:
        container_name: hawki_rag_neo4j
        image: neo4j:5.22
        restart: always
        # Neo4j interprets NEO4J_* as server settings. Pass client settings
        # only to Python consumers.
        environment:
            NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
        volumes:
            - neo4j_data:/data
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7474/browser"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    file-converter:
        container_name: hawki_rag_file_converter
        image: digitalenvironments/hawki-toolkit-file-converter:3.0.1
        restart: always
        environment:
            F_API_KEY: ${FILE_CONVERTER_TOKEN:?Set FILE_CONVERTER_TOKEN}
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    hawki_rag_rerank:
        container_name: hawki_rag_rerank
        image: ${HAWKI_RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:rerank-${HAWKI_RAG_VERSION:?Set the Python production release version}
        pull_policy: always
        environment:
            <<: *runtime_identity
            HAWKI_RERANKER_MODEL: ${HAWKI_RERANKER_MODEL:-${RERANKER_MODEL:-mixedbread-ai/mxbai-rerank-base-v1}}
            HAWKI_RERANKER_API_KEY:
            RERANKER_API_KEY:
            HF_TOKEN:
        restart: always
        stop_grace_period: 40s
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=3)"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s

    hawki_backend:
        <<: *shared_storage
        container_name: hawki_backend
        # Current CI has no production publishing job for the backend image.
        image: ${HAWKI_BACKEND_IMAGE:?Set the published Python backend image reference}
        pull_policy: always
        environment:
            <<: [*runtime_identity, *temporal_client, *task_queues, *storage_client, *model_client, *crawler_client, *converter_client, *worker_callback]
            PIPELINE_SHARED_STORAGE_GID: ${PGID:-33}
            HAWKI_BACKEND_DB_DSN: ${HAWKI_BACKEND_DB_DSN:?Set the restricted backend runtime DSN}
            HAWKI_BACKEND_DB_POOL_SIZE:
            HAWKI_BACKEND_DB_POOL_TIMEOUT_SECONDS:
            HAWKI_BACKEND_DB_POOL_RECYCLE_SECONDS:
            HAWKI_BACKEND_DB_CONNECT_TIMEOUT_SECONDS:
            HAWKI_BACKEND_DB_STATEMENT_TIMEOUT_MS:
            HAWKI_BACKEND_AUTH_ISSUER: ${HAWKI_BACKEND_AUTH_ISSUER:?Set the service JWT issuer}
            HAWKI_BACKEND_AUTH_AUDIENCE: ${HAWKI_BACKEND_AUTH_AUDIENCE:-hawki-backend}
            HAWKI_BACKEND_AUTH_JWKS_URL: ${HAWKI_BACKEND_AUTH_JWKS_URL:?Set the service JWT JWKS URL}
            HAWKI_BACKEND_AUTH_CLIENTS: ${HAWKI_BACKEND_AUTH_CLIENTS:?Set the service client registry}
            HAWKI_BACKEND_AUTH_ALGORITHMS: ${HAWKI_BACKEND_AUTH_ALGORITHMS:-RS256}
            HAWKI_BACKEND_AUTH_TENANT_CLAIM:
            HAWKI_BACKEND_AUTH_LEEWAY_SECONDS:
            HAWKI_BACKEND_AUTH_MAX_TOKEN_TTL_SECONDS:
            HAWKI_BACKEND_AUTH_JWKS_CACHE_TTL_SECONDS:
            HAWKI_BACKEND_AUTH_JWKS_MIN_REFRESH_SECONDS:
            HAWKI_BACKEND_AUTH_JWKS_MAX_STALE_SECONDS:
            HAWKI_BACKEND_AUTH_JWKS_TIMEOUT_SECONDS:
            HAWKI_BACKEND_AUTH_JWKS_MAX_BYTES:
            HAWKI_BACKEND_READINESS_JWKS_KEY_ID: ${HAWKI_BACKEND_READINESS_JWKS_KEY_ID:?Set the public readiness signing key ID}
            HAWKI_BACKEND_REQUIRE_READY_SCHEMA: "true"
            HAWKI_BACKEND_SERVICE_ONLY: "true"
            HAWKI_BACKEND_LARAVEL_OFF: "true"
            HAWKI_BACKEND_QUERY_DATASET_SOURCE: database
            HAWKI_BACKEND_QUERY_MODELS: ${HAWKI_BACKEND_QUERY_MODELS:?Set the query model registry}
            HAWKI_BACKEND_QUERY_RERANKER: ${HAWKI_BACKEND_QUERY_RERANKER:-external}
            RAG_GENERATE_ANSWER: ${RAG_GENERATE_ANSWER:-true}
            HAWKI_BACKEND_QUERY_RERANK_TOP_N:
            HAWKI_BACKEND_QUERY_RERANKER_MIX_MODE:
            HAWKI_BACKEND_QUERY_RERANKER_MIX_WEIGHT:
            RERANKER_API_URL: ${RERANKER_API_URL:-http://hawki_rag_rerank/v1/rerank}
            RERANKER_API_DIALECT: ${RERANKER_API_DIALECT:-hawki-cohere-v1}
            RERANKER_MODEL: ${RERANKER_MODEL:-mixedbread-ai/mxbai-rerank-base-v1}
            RERANKER_API_KEY:
            HAWKI_BACKEND_DATASET_EMBEDDING_PROVIDER:
            HAWKI_BACKEND_DATASET_EMBEDDING_MODEL:
            HAWKI_BACKEND_DATASET_GRAPH_ENABLED:
            # Imported archived rows stay fenced pending a separate approved handoff.
            HAWKI_BACKEND_DATASET_CLEANUP_ENABLED: "false"
            HAWKI_BACKEND_HISTORICAL_ARCHIVE_ROOT:
            HAWKI_WORKFLOW_CONTROL_URL: http://hawki_backend
            HAWKI_WORKFLOW_CONTROL_ENABLED: "true"
            TEMPORAL_WORKFLOW_EXECUTION_TIMEOUT:
            TEMPORAL_WORKFLOW_RUN_TIMEOUT:
            TEMPORAL_WORKFLOW_TASK_TIMEOUT:
            HAWKI_RAG_TEMPORAL_ENABLED: "true"
            HAWKI_RAG_TEMPORAL_SHARED_ROOT: /shared
            HAWKI_RAG_WORKER_CALLBACK_MAX_AGE_SECONDS: ${HAWKI_RAG_WORKER_CALLBACK_MAX_AGE_SECONDS:-300}
            HAWKI_BACKEND_TEXT_INGESTION_ENABLED: "true"
            HAWKI_BACKEND_TEXT_INGESTION_SHARED_ROOT: /shared
            HAWKI_BACKEND_TEXT_INGESTION_QDRANT_URL:
            HAWKI_BACKEND_TEXT_INGESTION_QDRANT_API_KEY:
            HAWKI_BACKEND_MANAGED_DOCUMENTS_ENABLED: "true"
            CHUNK_SIZE:
            CHUNK_OVERLAP_SIZE:
            INGEST_BATCH_SIZE:
            HAWKI_BACKEND_CUSTOM_UPLOADS_ENABLED: ${HAWKI_BACKEND_CUSTOM_UPLOADS_ENABLED:-false}
            FILE_CONVERTER_SUPPORTED_EXTENSIONS:
            CUSTOM_CONVERTER_STATUS_PATH:
            HAWKI_BACKEND_URL_INGESTION_ENABLED: ${HAWKI_BACKEND_URL_INGESTION_ENABLED:-false}
            HAWKI_BACKEND_URL_RECONCILE_ENABLED: "true"
            CUSTOM_CRAWLER_TASK_UI_URL:
            CUSTOM_CRAWLER_TASK_UI_PROFILES_PATH:
            CUSTOM_CRAWLER_TASK_UI_TASKS_PATH:
            CUSTOM_CRAWLER_TASK_UI_SUBMIT_PATH:
            HAWKI_URL_SITE_PROFILE_ROOT:
        depends_on:
            postgres:
                condition: service_healthy
            qdrant:
                condition: service_healthy
            hawki_rag_neo4j:
                condition: service_healthy
        restart: unless-stopped
        stop_grace_period: 40s
        healthcheck:
            test: ["CMD", "python", "-m", "hawki_backend.readiness", "--live"]
            interval: 15s
            timeout: 45s
            retries: 10
            start_period: 20s

    hawki_rag_ui_gateway:
        image: ${HAWKI_BACKEND_IMAGE:?Set the published Python backend image reference}
        pull_policy: always
        environment:
            <<: [*runtime_identity, *crawler_client]
            PYTHON_APP_MODULE: hawki_backend.ui_gateway:app
            HAWKI_RAG_UI_BACKEND_URL: http://hawki_backend
            HAWKI_RAG_UI_ACCESS_MODE: hawki
            HAWKI_RAG_UI_ORIGIN: ${HAWKI_RAG_UI_ORIGIN:?Set the public HTTPS UI origin}
            HAWKI_RAG_UI_AUTHORIZATION_URL: ${HAWKI_RAG_UI_AUTHORIZATION_URL:?Set the HAWKI management authorization endpoint}
            HAWKI_RAG_UI_SERVICE_TOKEN_FILE: /run/ui-service/access.jwt
            HAWKI_RAG_UI_CLIENT_SECRET_FILE: /run/ui-service/client.secret
            HAWKI_RAG_UI_TOKEN_URL:
            HAWKI_RAG_UI_CLIENT_ID: ${HAWKI_RAG_UI_CLIENT_ID:-rag-management}
            HAWKI_RAG_UI_SCOPES: ${HAWKI_RAG_UI_SCOPES:-rag:query rag:ingest rag:datasets:manage}
            CUSTOM_CRAWLER_TASK_UI_URL:
            CUSTOM_CRAWLER_UI_URL:
            SSL_CERT_FILE:
        volumes:
            - type: bind
              source: ${HAWKI_RAG_UI_CREDENTIAL_DIR:-./.secrets/ui-service}
              target: /run/ui-service
              read_only: true
              bind:
                  create_host_path: false
        depends_on:
            hawki_backend:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=3)"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 10s

    hawki_rag_frontend:
        # This must ship docker/frontend/nginx.conf, including the /internal deny routes.
        image: ${HAWKI_RAG_FRONTEND_IMAGE:?Set the published Python-era frontend image reference}
        pull_policy: always
        ports:
            - "${HAWKI_RAG_HTTP_BIND:-127.0.0.1}:${HAWKI_RAG_HTTP_PORT:-8080}:80"
        depends_on:
            hawki_backend:
                condition: service_healthy
            hawki_rag_ui_gateway:
                condition: service_healthy
        networks:
            - default
            - hawki-rag-network
        restart: unless-stopped

    hawki-rag-temporal-workflow-worker:
        <<: *worker
        container_name: hawki_rag_temporal_workflow_worker
        image: ${HAWKI_RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:workflow-worker-${HAWKI_RAG_VERSION:?Set the Python production release version}
        environment:
            <<: [*runtime_identity, *temporal_client]
            TEMPORAL_RAG_WORKFLOW_TASK_QUEUE: *workflow_queue
        depends_on:
            temporal:
                condition: service_healthy

    hawki-rag-temporal-scraper-worker:
        <<: [*worker, *shared_storage]
        container_name: hawki_rag_temporal_scraper_worker
        image: ${HAWKI_RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:scraper-worker-${HAWKI_RAG_VERSION:?Set the Python production release version}
        environment:
            <<: [*callback_worker_env, *crawler_client, *worker_http]
            TEMPORAL_RAG_SCRAPER_TASK_QUEUE: *scraper_queue
            EXTERNAL_SCRAPER_START_PATH:
            EXTERNAL_SCRAPER_STATUS_PATH:
            HAWKI_RAG_TEMPORAL_SCRAPER_LOG_PATH:
        depends_on:
            hawki_backend:
                condition: service_healthy
            temporal:
                condition: service_healthy

    hawki-rag-temporal-converter-worker:
        <<: [*worker, *shared_storage]
        container_name: hawki_rag_temporal_converter_worker
        image: ${HAWKI_RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:converter-worker-${HAWKI_RAG_VERSION:?Set the Python production release version}
        environment:
            <<: [*callback_worker_env, *converter_client, *worker_http]
            TEMPORAL_RAG_CONVERTER_TASK_QUEUE: *converter_queue
            HAWKI_RAG_TEMPORAL_CONVERTER_LOG_PATH:
        depends_on:
            hawki_backend:
                condition: service_healthy
            temporal:
                condition: service_healthy
            file-converter:
                condition: service_healthy

    hawki-rag-indexer-worker:
        <<: [*worker, *shared_storage]
        container_name: hawki_rag_indexer_worker
        image: ${HAWKI_RAG_IMAGE_REPOSITORY:-digitalenvironments/hawki-rag}:indexer-worker-${HAWKI_RAG_VERSION:?Set the Python production release version}
        environment:
            <<: [*callback_worker_env, *storage_client, *model_client]
            TEMPORAL_RAG_INDEXER_TASK_QUEUE: *indexer_queue
            TEMPORAL_RAG_INGESTION_TASK_QUEUE: *indexer_queue
            HAWKI_RAG_TEMPORAL_INDEXER_LOG_PATH:
            NEO4J_HTTP_URL:
            GRAPH_EMBEDDING_DIMENSIONS:
            GRAPH_DOC_MAX_CHUNKS:
            GRAPH_DOC_MAX_CHARS:
            GRAPH_MIN_CHUNK_CHARS:
            GRAPH_MIN_DOC_CHARS:
            MAX_ASYNC:
            MAX_PARALLEL_INSERT:
        depends_on:
            hawki_backend:
                condition: service_healthy
            temporal:
                condition: service_healthy
            qdrant:
                condition: service_started
            hawki_rag_neo4j:
                condition: service_started

volumes:
    shared_storage:
        name: rawki_shared_storage
    postgres_data:
        driver: local
    qdrant_data:
        driver: local
    neo4j_data:
        driver: local

networks:
    # Compose owns this existing named bridge. A containerized reverse proxy
    # can join it and route to hawki_rag_frontend:80. All upstreams stay on
    # the project network. A host proxy can use the loopback frontend port.
    hawki-rag-network:
        name: hawki-rag-network
        driver: bridge
