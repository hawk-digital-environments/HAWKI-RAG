[pytest]
testpaths =
    packages/artifact_store/tests
    packages/contracts/tests
    packages/external_jobs/tests
    packages/graph_store/tests
    packages/model_providers/tests
    packages/observability/tests
    packages/pipeline_callbacks/tests
    packages/text_processing/tests
    packages/vector_store/tests
    packages/worker_runtime/tests
    services/hawki_bridge/tests
    services/hawki_converter_worker/tests
    services/hawki_indexer_worker/tests
    services/hawki_scraper_worker/tests
    services/hawki_workflow_worker/tests
    tests
python_files = test_*.py
python_classes = *Tests Test*
python_functions = test_*
addopts = --strict-config --strict-markers --import-mode=importlib
markers =
    integration: requires one or more live infrastructure services
    model: requires a live model runtime or model gateway
