[project]
name = "hawki-indexer-worker"
version = "0.1.0"
description = "Temporal vector and graph indexing worker for RAWKI RAG"
readme = "README.md"
authors = [
    { name = "Yazdan Asadi", email = "wentlerhiphop@gmail.com" }
]
requires-python = "==3.13.14"
dependencies = [
    "av==13.1.0",
    "hawki-artifact-store==0.1.0",
    "hawki-graph-store==0.1.0",
    "hawki-model-providers==0.1.0",
    "hawki-rag-contracts==0.1.0",
    "hawki-rag-resilience==0.1.0",
    "hawki-rag-text==0.1.0",
    "hawki-vector-store==0.1.0",
    "hawki-worker-runtime==0.1.0",
    "lightrag-hku==1.5.5",
    "mineru[pipeline]==3.4.4",
    "numpy==2.5.1",
    "raganything[all]==1.3.1",
    "temporalio==1.30.0",
]

[dependency-groups]
test = [
    "pytest==8.4.2",
]

[project.optional-dependencies]
cpu = [
    "torch==2.13.0",
    "torchvision==0.28.0",
]
gpu = [
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[project.scripts]
hawki-indexer-worker = "hawki_indexer_worker.main:main"

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
hawki-artifact-store = { workspace = true }
hawki-graph-store = { workspace = true }
hawki-model-providers = { workspace = true }
hawki-rag-contracts = { workspace = true }
hawki-rag-resilience = { workspace = true }
hawki-rag-text = { workspace = true }
hawki-vector-store = { workspace = true }
hawki-worker-runtime = { workspace = true }
lightrag-hku = { git = "https://github.com/HKUDS/LightRAG.git", rev = "c5bf73dbf6139f1b03f738a2fec4e47d5e66f3ab" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
