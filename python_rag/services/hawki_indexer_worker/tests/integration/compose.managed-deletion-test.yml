# Test-only project: no deployment env files, mounts, volumes or external networks.
# Use -p rawki-managed-deletion-test; published ports bind only to loopback.
services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports: ["127.0.0.1:16333:6333"]
  neo4j:
    image: neo4j:5.22
    environment:
      NEO4J_AUTH: neo4j/disposable-test-password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    ports: ["127.0.0.1:17687:7687"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal_test
      POSTGRES_PASSWORD: disposable-test-password
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal_test
      POSTGRES_PWD: disposable-test-password
      POSTGRES_SEEDS: postgres
    ports: ["127.0.0.1:17233:7233"]
