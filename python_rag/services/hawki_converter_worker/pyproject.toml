[project]
name = "hawki-converter-worker"
version = "0.1.0"
description = "Temporal conversion worker for RAWKI RAG artifacts"
readme = "README.md"
authors = [
    { name = "Yazdan Asadi", email = "wentlerhiphop@gmail.com" }
]
requires-python = "==3.13.14"
dependencies = [
    "hawki-artifact-store==0.1.0",
    "hawki-external-jobs==0.1.0",
    "hawki-observability==0.1.0",
    "hawki-pipeline-callbacks==0.1.0",
    "hawki-rag-contracts==0.1.0",
    "hawki-rag-text==0.1.0",
    "hawki-worker-runtime==0.1.0",
    "requests==2.34.2",
    "temporalio==1.30.0",
]

[dependency-groups]
test = [
    "pytest==8.4.2",
]

[project.scripts]
hawki-converter-worker = "hawki_converter_worker.main:main"

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.uv.sources]
hawki-artifact-store = { workspace = true }
hawki-external-jobs = { workspace = true }
hawki-observability = { workspace = true }
hawki-pipeline-callbacks = { workspace = true }
hawki-rag-contracts = { workspace = true }
hawki-rag-text = { workspace = true }
hawki-worker-runtime = { workspace = true }
