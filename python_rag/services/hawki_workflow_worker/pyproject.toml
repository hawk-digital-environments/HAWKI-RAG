[project]
name = "hawki-workflow-worker"
version = "0.1.0"
description = "Deterministic Temporal workflow worker for HAWKI RAG ingestion"
readme = "README.md"
authors = [
    { name = "Yazdan Asadi", email = "wentlerhiphop@gmail.com" }
]
requires-python = "==3.13.11"
dependencies = [
    "hawki-rag-contracts==0.1.0",
    "temporalio==1.30.0",
]

[dependency-groups]
test = [
    "pytest==8.4.2",
]

[project.scripts]
hawki-workflow-worker = "hawki_workflow_worker.main:main"

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.uv.sources]
hawki-rag-contracts = { workspace = true }
