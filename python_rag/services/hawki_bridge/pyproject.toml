[project]
name = "hawki-bridge"
version = "0.1.0"
description = "Read-only query, graph-read, and Temporal-control bridge for RAWKI RAG"
readme = "README.md"
authors = [
    { name = "Yazdan Asadi", email = "wentlerhiphop@gmail.com" }
]
requires-python = "==3.13.14"
dependencies = [
    "fastapi==0.139.2",
    "hawki-model-providers==0.1.0",
    "hawki-rag-contracts==0.1.0",
    "hawki-rag-resilience==0.1.0",
    "hawki-rag-stores==0.1.0",
    "hawki-rag-text==0.1.0",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "starlette==1.3.1",
    "temporalio==1.30.0",
    "uvicorn[standard]==0.30.6",
]

[dependency-groups]
test = [
    "httpx==0.27.2",
    "pytest==8.4.2",
]

[project.scripts]
hawki-bridge = "hawki_bridge.main:run"

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.uv.sources]
hawki-model-providers = { workspace = true }
hawki-rag-contracts = { workspace = true }
hawki-rag-resilience = { workspace = true }
hawki-rag-stores = { workspace = true }
hawki-rag-text = { workspace = true }
