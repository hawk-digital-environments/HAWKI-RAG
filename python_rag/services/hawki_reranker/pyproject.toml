[project]
name = "hawki-reranker"
version = "0.1.0"
description = "Cohere-compatible local reranker HTTP service for RAWKI RAG"
readme = "README.md"
authors = [
    { name = "Yazdan Asadi", email = "wentlerhiphop@gmail.com" }
]
requires-python = "==3.13.14"
dependencies = [
    "fastapi==0.139.2",
    "hawki-rag-contracts==0.1.0",
    "hawki-rag-resilience==0.1.0",
    "sentence-transformers==5.6.0",
    "transformers==5.14.1",
    "uvicorn[standard]==0.30.6",
]

[dependency-groups]
test = [
    "httpx==0.27.2",
    "pytest==8.4.2",
]

[project.optional-dependencies]
cpu = ["torch==2.13.0"]
gpu = ["torch==2.13.0"]

[project.scripts]
hawki-reranker = "hawki_reranker.main:run"

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
hawki-rag-contracts = { workspace = true }
hawki-rag-resilience = { workspace = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
