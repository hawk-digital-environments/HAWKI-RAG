[project]
name = "hawki-reranking"
version = "0.1.0"
description = "Reusable local and SDK reranking clients"
requires-python = "==3.13.14"
dependencies = ["litellm==1.106.4"]

[project.optional-dependencies]
local = ["sentence-transformers==5.6.0", "transformers==4.57.6", "torch==2.13.0"]

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"
