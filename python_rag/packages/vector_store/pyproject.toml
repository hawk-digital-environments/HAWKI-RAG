[project]
name = "hawki-vector-store"
version = "0.1.0"
description = "Typed vector-store contracts and Qdrant adapter for RAWKI RAG"
readme = "README.md"
authors = [
    { name = "Yazdan Asadi", email = "wentlerhiphop@gmail.com" }
]
requires-python = "==3.13.14"
dependencies = [
    "hawki-observability==0.1.0",
    "requests==2.34.2",
]

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hawki_vector_store"

[tool.uv.sources]
hawki-observability = { workspace = true }
