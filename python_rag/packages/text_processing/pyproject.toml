[project]
name = "hawki-rag-text"
version = "0.1.0"
description = "Pure text normalization, chunking, tagging, and safety helpers for RAWKI RAG"
readme = "README.md"
authors = [
    { name = "Yazdan Asadi", email = "wentlerhiphop@gmail.com" }
]
requires-python = "==3.13.11"
dependencies = []

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hawki_rag_text"
source-include = ["src/hawki_rag_text/resources/german_stopwords_full.txt"]
