[project]
name = "hawki-rag-stores"
version = "0.1.0"
description = "Typed Qdrant and Neo4j storage adapters for RAWKI RAG"
readme = "README.md"
authors = [
    { name = "Yazdan Asadi", email = "wentlerhiphop@gmail.com" }
]
requires-python = "==3.13.14"
dependencies = [
    "hawki-rag-resilience==0.1.0",
    "hawki-rag-text==0.1.0",
    "neo4j==6.2.0",
    "requests==2.34.2",
]

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hawki_rag_stores"

[tool.uv.sources]
hawki-rag-resilience = { workspace = true }
hawki-rag-text = { workspace = true }
