[project]
name = "hawki-rag-contracts"
version = "0.1.0"
description = "Typed, side-effect-free wire contracts for HAWKI RAG services"
readme = "README.md"
authors = [
    { name = "Yazdan Asadi", email = "wentlerhiphop@gmail.com" }
]
requires-python = "==3.13.14"
dependencies = [
    "pydantic==2.13.4",
]

[dependency-groups]
test = [
    "pytest==8.4.2",
]

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"
