[project]
name = "python-rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
rerank = [
    "fastapi==0.139.2",
    "pydantic>=2.8,<3",
    "sentence-transformers==5.6.0",
    "starlette==1.3.1",
    "transformers==5.14.1",
    "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
cpu = [
  "torch==2.13.0",
]
cu130 = [
  "torch==2.13.0",
]

[tool.uv]
package=false
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.workspace]
members = [
    "hawki_bridge",
]

