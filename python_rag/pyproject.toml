[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.uv]
override-dependencies = [
    "mineru[pipeline]==3.4.4",
]
conflicts = [
    [
        { package = "hawki-indexer-worker" },
        { package = "hawki-reranker" },
    ],
]

[dependency-groups]
lint = [
    "ruff==0.15.22",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    ".venv",
    ".venv-reranker",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
