openapi: 3.0.3
info:
  title: HAWKI RAG API
  description: Local API reference generated from currently registered routes.
  version: "1.0.0"
servers:
  - url: /api
    description: Laravel API base URL
paths:
  /ping:
    get:
      tags:
        - Health
      summary: Health ping
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
              example:
                pong: true
  /datasets:
    get:
      tags:
        - Datasets
      summary: List datasets
      security:
        - {}
      responses:
        "200":
          description: Datasets list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags:
        - Datasets
      summary: Create dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Dataset created
        "401":
          $ref: "#/components/responses/Unauthorized"
  /datasets/{dataset_id}:
    parameters:
      - in: path
        name: dataset_id
        required: true
        schema:
          type: string
    get:
      tags:
        - Datasets
      summary: Get dataset
      responses:
        "200":
          description: Dataset details
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /documents:
    get:
      tags:
        - Documents
      summary: List documents
      description: |
        Unified document list for HAWKI RAG.

        Read behavior:
        - returns managed upload documents with `adoc_*` or `doc_*` handles when matching managed documents exist
        - falls back to legacy indexed document UUID records when no managed documents match the current filter
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: dataset_id
          required: false
          schema:
            type: string
          description: Dataset filter using the snake_case query name accepted by the API.
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Free-text search term.
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Free-text search term alias.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedDocumentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Documents
      summary: Upload one document into a dataset and start ingest
      description: |
        Creates one managed document from one uploaded file.

        Managed document model:
        - the public document handle is the `adoc_*` or `doc_*` id returned in `document.document_id`
        - one `dataset_id` groups documents that should be indexed together
        - the managed document remains the stable public handle for later read, replace, and delete operations
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - dataset_id
              properties:
                file:
                  type: string
                  format: binary
                dataset_id:
                  type: string
                  description: Dataset identifier used to group this document with related documents.
                source_updated_at:
                  type: string
                  format: date-time
                source_checksum_sha256:
                  type: string
                graph:
                  type: boolean
                  default: false
                  description: Optional. If omitted, ingest stays vector-only and does not write Neo4j graph data.
                display_name:
                  type: string
                source_url:
                  type: string
                  format: uri
                metadata_json:
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: string
      responses:
        "202":
          description: Managed document accepted for ingest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDocumentMutationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation failed
  /documents/batch:
    post:
      tags:
        - Documents
      summary: Upload many documents into one dataset and start one ingest workflow per file
      description: |
        Creates one managed document per uploaded file.

        Batch behavior:
        - all files in the same request share the same `dataset_id`
        - each file still becomes its own managed `adoc_*` document handle
        - deleting one managed document is intended to remove only that file's indexed outputs while keeping the rest of the dataset intact
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
                - dataset_id
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                dataset_id:
                  type: string
                  description: Dataset identifier shared by every file in this batch.
                graph:
                  type: boolean
                  default: false
                  description: Optional. If omitted, ingests stay vector-only and do not write Neo4j graph data.
                metadata_json:
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: string
      responses:
        "202":
          description: All managed documents were accepted for ingest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDocumentBatchResponse"
        "207":
          description: Some managed documents were accepted and some failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDocumentBatchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation failed
  /documents/{document_id}:
    parameters:
      - in: path
        name: document_id
        required: true
        schema:
          type: string
        description: |
          Unified document handle.

          Accepted values:
          - managed public document ids such as `adoc_...` or `doc_...`
          - legacy indexed document UUIDs for read-only access
    get:
      tags:
        - Documents
      summary: Get document
      description: |
        Returns one document from the unified surface.

        Read behavior:
        - `adoc_*` and `doc_*` ids resolve to managed documents
        - UUID ids resolve to legacy indexed documents
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedDocumentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Documents
      summary: Replace a managed document if the incoming file is newer
      description: |
        Replaces one managed document while keeping it in the same dataset.

        This operation only supports managed `adoc_*` or `doc_*` document ids.
        Passing a legacy indexed document UUID returns `404`.
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                source_updated_at:
                  type: string
                  format: date-time
                source_checksum_sha256:
                  type: string
                graph:
                  type: boolean
                  description: Optional override. If omitted, the current graph setting is preserved.
                display_name:
                  type: string
                source_url:
                  type: string
                  format: uri
                metadata_json:
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: string
                force:
                  type: boolean
      responses:
        "200":
          description: Replacement skipped because the document is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDocumentMutationResponse"
        "202":
          description: Replacement accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDocumentMutationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation failed
    delete:
      tags:
        - Documents
      summary: Delete one managed document's active indexed outputs
      description: |
        Deletes the active indexed outputs for one managed document.

        This operation only supports managed `adoc_*` or `doc_*` document ids.
        Passing a legacy indexed document UUID returns `404`.
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Managed document deleted from derived indexes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDocumentDeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /pipeline/tasks:
    get:
      tags:
        - Pipeline
      summary: List pipeline tasks
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Pipeline
      summary: Start legacy pipeline task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Task started
        "401":
          $ref: "#/components/responses/Unauthorized"
  /pipeline/tasks/start:
    post:
      tags:
        - Pipeline
      summary: Start pipeline task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Task started
        "401":
          $ref: "#/components/responses/Unauthorized"
  /pipeline/tasks/{task_id}:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
    get:
      tags:
        - Pipeline
      summary: Get task
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
  /pipeline/tasks/{task_id}/jobs:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
    get:
      tags:
        - Pipeline
      summary: List task jobs
      responses:
        "200":
          description: Jobs list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags:
        - Pipeline
      summary: Upsert a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Job upserted
  /pipeline/tasks/{task_id}/failed-jobs:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
    get:
      tags:
        - Pipeline
      summary: List failed jobs for task
      responses:
        "200":
          description: Failed jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /pipeline/tasks/{task_id}/events:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
    get:
      tags:
        - Pipeline
      summary: Stream/events for task
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /pipeline/tasks/{task_id}/retry:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
    post:
      tags:
        - Pipeline
      summary: Retry task
      responses:
        "200":
          description: Retry initiated
  /pipeline/tasks/{task_id}/retry-failed-jobs:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
    post:
      tags:
        - Pipeline
      summary: Retry failed jobs of task
      responses:
        "200":
          description: Retry initiated
  /pipeline/tasks/{task_id}/cancel:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
    post:
      tags:
        - Pipeline
      summary: Cancel task
      responses:
        "200":
          description: Cancellation accepted
  /pipeline/health:
    get:
      tags:
        - Pipeline
      summary: Pipeline health status
      responses:
        "200":
          description: Pipeline health snapshot
          content:
            application/json:
              schema:
                type: object
  /pipeline/controller/files:
    post:
      tags:
        - Pipeline
      summary: Upload pipeline control files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File received
  /pipeline/recovery/failed-jobs:
    get:
      tags:
        - Pipeline Recovery
      summary: List failed jobs
      responses:
        "200":
          description: Failed job list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /pipeline/recovery/jobs/retry-selected:
    post:
      tags:
        - Pipeline Recovery
      summary: Retry selected failed jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Retry queued
  /pipeline/recovery/jobs/{job_id}/retry:
    parameters:
      - in: path
        name: job_id
        required: true
        schema:
          type: string
    post:
      tags:
        - Pipeline Recovery
      summary: Retry single failed job
      responses:
        "200":
          description: Retry queued
  /pipeline/recovery/retry-all:
    post:
      tags:
        - Pipeline Recovery
      summary: Retry all failed jobs
      responses:
        "200":
          description: Retry queued
  /pipeline/recovery/tasks/{task_id}/retry-failed:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
    post:
      tags:
        - Pipeline Recovery
      summary: Retry failed jobs for a task
      responses:
        "200":
          description: Retry queued
  /pipeline/recovery/datasets/{dataset_id}/retry-failed:
    parameters:
      - in: path
        name: dataset_id
        required: true
        schema:
          type: string
    post:
      tags:
        - Pipeline Recovery
      summary: Retry failed jobs for a dataset
      responses:
        "200":
          description: Retry queued
  /query:
    post:
      tags:
        - Query
      summary: Query RAG backend
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
  /rag/health:
    get:
      tags:
        - RAG
      summary: Show RAG health
      responses:
        "200":
          description: Health details
          content:
            application/json:
              schema:
                type: object
  /rag/monitor:
    get:
      tags:
        - RAG
      summary: RAG monitor
      responses:
        "200":
          description: Monitor payload
          content:
            application/json:
              schema:
                type: object
  /rag/stats:
    get:
      tags:
        - RAG
      summary: RAG statistics
      responses:
        "200":
          description: Stats payload
          content:
            application/json:
              schema:
                type: object
  /rag/neo4j/graph/overview:
    get:
      tags:
        - Graph
      summary: Get graph overview
      responses:
        "200":
          description: Overview payload
          content:
            application/json:
              schema:
                type: object
  /rag/neo4j/graph/search:
    get:
      tags:
        - Graph
      summary: Search graph
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Search result
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /rag/neo4j/graph/semantic-search:
    get:
      tags:
        - Graph
      summary: Graph semantic search
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Search result
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /rag/neo4j/graph/node:
    get:
      tags:
        - Graph
      summary: Get graph node
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node payload
          content:
            application/json:
              schema:
                type: object
  /rag/neo4j/graph/expand:
    post:
      tags:
        - Graph
      summary: Expand graph node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Expanded graph data
  /rag/neo4j/graph/clear-view:
    post:
      tags:
        - Graph
      summary: Clear graph view
      responses:
        "200":
          description: View cleared
  /rag/neo4j/graph/snapshots:
    get:
      tags:
        - Graph
      summary: List graph snapshots
      responses:
        "200":
          description: Snapshot list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags:
        - Graph
      summary: Save graph snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Snapshot saved
  /rag/neo4j/graph/snapshots/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags:
        - Graph
      summary: Load graph snapshot
      responses:
        "200":
          description: Snapshot payload
          content:
            application/json:
              schema:
                type: object
    delete:
      tags:
        - Graph
      summary: Delete snapshot
      responses:
        "204":
          description: Deleted
  /rag/neo4j/clear:
    post:
      tags:
        - Graph
      summary: Clear Neo4j graph content
      responses:
        "200":
          description: Graph cleared
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer
    PingResponse:
      type: object
      properties:
        pong:
          type: boolean
    QueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
    QueryResponse:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            type: object
    DocumentOperation:
      type: object
      properties:
        type:
          type: string
        status:
          type: string
        reason:
          type: string
          nullable: true
    DocumentPipelineReference:
      type: object
      properties:
        task_id:
          type: string
          nullable: true
        job_id:
          type: string
          nullable: true
        source_id:
          type: string
          nullable: true
    RelatedJob:
      type: object
      properties:
        job_id:
          type: string
        task_id:
          type: string
          nullable: true
        parent_job_id:
          type: string
          nullable: true
        job_type:
          type: string
        status:
          type: string
        source_url:
          type: string
          nullable: true
        local_path:
          type: string
          nullable: true
        content_hash:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    ManagedDocumentOutput:
      type: object
      description: One active indexed output for one managed document version.
      properties:
        bridge_document_id:
          type: string
          description: Python bridge document id used for downstream delete and replacement operations.
        qdrant_collection:
          type: string
          description: Qdrant collection that holds this document's chunk points.
        neo4j_namespace:
          type: string
          nullable: true
          description: Neo4j namespace used for graph writes when graph ingest is enabled.
        chunk_count:
          type: integer
          description: Number of active chunks currently indexed for this document output.
        status:
          type: string
        active:
          type: boolean
        indexed_at:
          type: string
          format: date-time
          nullable: true
    ManagedDocumentResource:
      type: object
      description: |
        Unified managed document view for uploaded files.

        Preferred public handle:
        - `document_id`

        Compatibility alias:
        - `id`
      properties:
        id:
          type: string
        document_id:
          type: string
        dataset_id:
          type: string
          description: Dataset identifier. Multiple managed documents can share this dataset and therefore share the same Qdrant collection.
        status:
          type: string
        graph_enabled:
          type: boolean
          description: Whether new ingests for this managed document should also write graph data to Neo4j.
        display_name:
          type: string
          nullable: true
        title:
          type: string
        source_type:
          type: string
        source_url:
          type: string
          nullable: true
        source_updated_at:
          type: string
          format: date-time
          nullable: true
        source_checksum_sha256:
          type: string
          nullable: true
        content_hash:
          type: string
          nullable: true
        latest_document_version:
          type: string
          nullable: true
        indexed_at:
          type: string
          format: date-time
          nullable: true
        ingested_at:
          type: string
          format: date-time
          nullable: true
        latest_task_id:
          type: string
          nullable: true
        latest_job_id:
          type: string
          nullable: true
        latest_source_id:
          type: string
          nullable: true
        last_error:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        metadata_json:
          type: object
          nullable: true
          additionalProperties: true
        original_filename:
          type: string
          nullable: true
        content_type:
          type: string
          nullable: true
        local_path:
          type: string
          nullable: true
        collection:
          type: string
          nullable: true
        qdrant_collection:
          type: string
          nullable: true
        neo4j_namespace:
          type: string
          nullable: true
        qdrant_status:
          type: string
          nullable: true
        neo4j_status:
          type: string
          nullable: true
        file_size:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/ManagedDocumentOutput"
          description: Active indexed outputs for this managed document. A single uploaded PDF can produce many chunks but still appears here as one document output record.
        active_output_count:
          type: integer
        active_chunk_count:
          type: integer
          description: Total active chunks currently indexed for this managed document across its active outputs.
        qdrant_point_count:
          type: integer
          nullable: true
        neo4j_entity_count:
          type: integer
          nullable: true
        neo4j_relation_count:
          type: integer
          nullable: true
        neo4j_live_stats:
          type: object
