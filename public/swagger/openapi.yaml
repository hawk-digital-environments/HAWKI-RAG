openapi: 3.0.3
info:
  title: HAWKI RAG V2
  description: >
    Application-token API contract for the canonical HAWKI RAG V2 surface.
    These endpoints cover tenants, applications, heaps, documents, corpora,
    groups, and authorization grants.
  version: "2.0.0"
servers:
  - url: /api
    description: Laravel API base URL
security:
  - ApplicationBearerAuth: []
tags:
  - name: Tenants
  - name: Applications
  - name: Heaps
  - name: Documents
  - name: Corpora
  - name: Search
  - name: Groups
  - name: Authorization
paths:
  /tenants:
    get:
      tags: [Tenants]
      summary: List tenants
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTenantResponse"
    post:
      tags: [Tenants]
      summary: Create tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tenants/{tenant_id}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Tenants]
      summary: Get tenant
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"
  /applications:
    get:
      tags: [Applications]
      summary: List applications
      parameters:
        - $ref: "#/components/parameters/TenantFilter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Application list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedApplicationResponse"
    post:
      tags: [Applications]
      summary: Create application and issue bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationCreateResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /applications/{application_id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [Applications]
      summary: Get application
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          $ref: "#/components/responses/NotFound"
  /heaps:
    get:
      tags: [Heaps]
      summary: List heaps
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/TenantFilter"
        - $ref: "#/components/parameters/OwnerAppFilter"
        - $ref: "#/components/parameters/VisibilityFilter"
        - $ref: "#/components/parameters/ProtectedFilter"
      responses:
        "200":
          description: Heap list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedHeapResponse"
    post:
      tags: [Heaps]
      summary: Create heap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHeapRequest"
      responses:
        "201":
          description: Heap created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Heap"
        "422":
          $ref: "#/components/responses/ValidationError"
  /heaps/{heap_id}:
    parameters:
      - $ref: "#/components/parameters/HeapId"
    get:
      tags: [Heaps]
      summary: Get heap
      responses:
        "200":
          description: Heap detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Heap"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Heaps]
      summary: Update heap metadata or protection state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHeapRequest"
      responses:
        "200":
          description: Heap updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Heap"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Heaps]
      summary: Delete heap and storage backends
      responses:
        "204":
          description: Heap deleted
        "502":
          description: Backend cleanup partially failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeapDeleteFailureResponse"
  /heaps/{heap_id}/documents:
    parameters:
      - $ref: "#/components/parameters/HeapId"
    get:
      tags: [Documents]
      summary: List documents in a heap
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDocumentResponse"
    post:
      tags: [Documents]
      summary: Create document in a heap
      description: >
        Accepts either JSON text content or multipart file upload. File uploads
        return a queued document plus pipeline task identifiers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentTextRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateDocumentFileRequest"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentCreateResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      summary: Get a document
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Documents]
      summary: Update a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
      responses:
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Documents]
      summary: Delete a document
      responses:
        "204":
          description: Document deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /corpora:
    get:
      tags: [Corpora]
      summary: List corpora
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Corpus list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCorpusResponse"
  /corpora/{corpus_id}:
    parameters:
      - $ref: "#/components/parameters/CorpusId"
    get:
      tags: [Corpora]
      summary: Get corpus
      responses:
        "200":
          description: Corpus detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Corpus"
        "404":
          $ref: "#/components/responses/NotFound"
  /search:
    post:
      tags: [Search]
      summary: Search documents
      description: >
        Laravel resolves application scope and optional user-based grant scope,
        merges them with the client filter expression, and forwards only the
        canonical bridge payload to Python.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /search/chunks:
    post:
      tags: [Search]
      summary: Search and return chunk-shaped results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Chunk search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkSearchResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /search/chunks/grouped:
    post:
      tags: [Search]
      summary: Search and group chunks by document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Grouped chunk search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupedChunkSearchResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/check:
    get:
      tags: [Authorization]
      summary: Check heap or document access for a user identifier
      description: >
        Returns the permission decision for exactly one heap or document. When
        authorization is disabled in this branch, scoped resources are treated
        as permitted and no authorization side effects occur.
      parameters:
        - in: query
          name: user_identifier
          required: true
          schema:
            type: string
          description: Opaque external user identifier matched exactly by Laravel.
        - in: query
          name: heap_id
          schema:
            type: string
        - in: query
          name: document_id
          schema:
            type: string
      responses:
        "200":
          description: Access check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCheckResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/users/by-identifier/heaps:
    get:
      tags: [Authorization]
      summary: List heap ids accessible to a user identifier
      description: >
        Returns heap ids granted to the external user identifier. When
        authorization is disabled in this branch, the endpoint is accepted as a
        no-op and returns an empty page.
      parameters:
        - in: query
          name: identifier
          required: true
          schema:
            type: string
          description: Opaque external user identifier matched exactly by Laravel.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Accessible heap ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeapsByIdentifierResponse"
  /auth/groups:
    get:
      tags: [Groups]
      summary: List groups
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedGroupResponse"
    post:
      tags: [Groups]
      summary: Create group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/groups/{group_id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Groups]
      summary: Get group
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Groups]
      summary: Delete group
      responses:
        "204":
          description: Group deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/groups/{group_id}/users:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Groups]
      summary: List group members
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Group member list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedIdentifierResponse"
    put:
      tags: [Groups]
      summary: Replace group members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceUsersRequest"
      responses:
        "200":
          description: Group members replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedIdentifierResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [Groups]
      summary: Add and remove group members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUsersRequest"
      responses:
        "200":
          description: Group members updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedIdentifierResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/heaps/{heap_id}:
    parameters:
      - $ref: "#/components/parameters/HeapId"
    get:
      tags: [Authorization]
      summary: Get heap grants
      responses:
        "200":
          description: Heap grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeapGrantPayload"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Authorization]
      summary: Replace heap grants
      description: >
        Creates or replaces heap grants. When authorization is disabled, the
        request is accepted and returns an empty grant set without side effects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGrantAssignmentsRequest"
      responses:
        "201":
          description: Heap grants created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeapGrantPayload"
        "200":
          description: Heap grants replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeapGrantPayload"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [Authorization]
      summary: Update heap grants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGrantAssignmentsRequest"
      responses:
        "200":
          description: Heap grants updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeapGrantPayload"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Authorization]
      summary: Delete heap grants and unprotect heap
      responses:
        "204":
          description: Heap grants deleted
  /auth/documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Authorization]
      summary: Get document grants
      responses:
        "200":
          description: Document grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentGrantPayload"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Authorization]
      summary: Replace document grants
      description: >
        Creates or replaces direct document user grants. Document grants are
        user-only in the canonical V2 auth API. When authorization is disabled,
        the request is accepted and returns an empty grant set without side
        effects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceDocumentGrantAssignmentsRequest"
      responses:
        "201":
          description: Document grants created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentGrantPayload"
        "200":
          description: Document grants replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentGrantPayload"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [Authorization]
      summary: Update document grants
      description: Direct document grant deltas are user-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentGrantAssignmentsRequest"
      responses:
        "200":
          description: Document grants updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentGrantPayload"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Authorization]
      summary: Delete document grants
      responses:
        "204":
          description: Document grants deleted
components:
  securitySchemes:
    ApplicationBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Application bearer token issued by POST /api/applications.
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 250
        default: 25
    TenantFilter:
      in: query
      name: tenant_id
      schema:
        type: string
    OwnerAppFilter:
      in: query
      name: owner_application_id
      schema:
        type: string
    VisibilityFilter:
      in: query
      name: visibility
      description: Hidden heaps are excluded by default; use all to include hidden heaps.
      schema:
        type: string
        enum: [discoverable, all]
    ProtectedFilter:
      in: query
      name: protected
      schema:
        type: boolean
    TenantId:
      in: path
      name: tenant_id
      required: true
      schema:
        type: string
    ApplicationId:
      in: path
      name: application_id
      required: true
      schema:
        type: string
    HeapId:
      in: path
      name: heap_id
      required: true
      schema:
        type: string
    DocumentId:
      in: path
      name: document_id
      required: true
      schema:
        type: string
    GroupId:
      in: path
      name: group_id
      required: true
      schema:
        type: string
    CorpusId:
      in: path
      name: corpus_id
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid application bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
      required: [page, per_page, total]
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    Metadata:
      type: object
      additionalProperties: true
    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
        application_count:
          type: integer
        group_count:
          type: integer
        heap_count:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [id, name, metadata]
    PaginatedTenantResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [data, pagination]
    CreateTenantRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
      required: [name]
    Application:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
            enum: [reads, reads-all-apps, reads-federated, reads-protected]
        metadata:
          $ref: "#/components/schemas/Metadata"
        heap_count:
          type: integer
        group_count:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [id, tenant_id, name, permissions, metadata]
    ApplicationCreateResponse:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            token:
              type: string
            token_type:
              type: string
              example: Bearer
          required: [token, token_type]
    PaginatedApplicationResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [data, pagination]
    CreateApplicationRequest:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
            enum: [reads, reads-all-apps, reads-federated, reads-protected]
        metadata:
          $ref: "#/components/schemas/Metadata"
      required: [name]
    Heap:
      type: object
      properties:
        id:
          type: string
        heap_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        tenant_id:
          type: string
        owner_app:
          type: string
        visibility:
          type: string
          enum: [discoverable, hidden]
        protected:
          type: boolean
        metadata:
          $ref: "#/components/schemas/Metadata"
        qdrant_collection:
          type: string
          nullable: true
        neo4j_namespace:
          type: string
          nullable: true
        document_count:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [id, heap_id, name, tenant_id, owner_app, visibility, protected, metadata]
    PaginatedHeapResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Heap"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [data, pagination]
    CreateHeapRequest:
      type: object
      properties:
        id:
          type: string
        heap_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        owner_application_id:
          type: string
        visibility:
          type: string
          enum: [discoverable, hidden]
        metadata:
          $ref: "#/components/schemas/Metadata"
      required: [name]
    UpdateHeapRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        visibility:
          type: string
          enum: [discoverable, hidden]
        metadata:
          $ref: "#/components/schemas/Metadata"
    Document:
      type: object
      properties:
        id:
          type: string
        document_id:
          type: string
        heap_id:
          type: string
        corpus_id:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
        source_type:
          type: string
          enum: [api, upload, manual]
        original_filename:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: string
          enum: [created, queued, processing, completed, failed, archived]
