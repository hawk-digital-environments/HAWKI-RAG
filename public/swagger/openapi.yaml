    CanonicalFilterScalar:
      oneOf:
        - type: string
        - type: boolean
        - type: integer
        - type: number
    CanonicalFilterValue:
      oneOf:
        - $ref: "#/components/schemas/CanonicalFilterScalar"
        - type: array
          items:
            $ref: "#/components/schemas/CanonicalFilterScalar"
    CanonicalFilterLeaf:
      type: array
      minItems: 2
      maxItems: 2
      description: >
        Field/value filter leaf in the form ["field", value]. The first item is
        the field name and the second item is a scalar or scalar array. Array
        values mean logical OR across values.
      items:
        oneOf:
          - type: string
          - $ref: "#/components/schemas/CanonicalFilterValue"
    CanonicalFilterImplicitAnd:
      type: array
      description: Root-level sibling expressions are treated as an implicit AND.
      items:
        $ref: "#/components/schemas/CanonicalFilterExpression"
    CanonicalFilterAnd:
      type: array
      minItems: 2
      maxItems: 2
      description: Boolean AND expression in the form ["AND", [child expressions...]].
      items:
        oneOf:
          - type: string
            enum: [AND]
          - type: array
            items:
              $ref: "#/components/schemas/CanonicalFilterExpression"
    CanonicalFilterOr:
      type: array
      minItems: 2
      maxItems: 2
      description: Boolean OR expression in the form ["OR", [child expressions...]].
      items:
        oneOf:
          - type: string
            enum: [OR]
          - type: array
            items:
              $ref: "#/components/schemas/CanonicalFilterExpression"
    CanonicalFilterNot:
      type: array
      minItems: 2
      maxItems: 2
      description: Boolean NOT expression in the form ["NOT", child expression].
      items:
        oneOf:
          - type: string
            enum: [NOT]
          - $ref: "#/components/schemas/CanonicalFilterExpression"
    CanonicalFilterExpression:
      oneOf:
        - $ref: "#/components/schemas/CanonicalFilterLeaf"
        - $ref: "#/components/schemas/CanonicalFilterImplicitAnd"
        - $ref: "#/components/schemas/CanonicalFilterAnd"
        - $ref: "#/components/schemas/CanonicalFilterOr"
        - $ref: "#/components/schemas/CanonicalFilterNot"
    SearchRequest:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        filters:
          $ref: "#/components/schemas/CanonicalFilterExpression"
        user_identifier:
          type: string
          description: >
            Optional opaque external user identifier used by Laravel for
            grant-based narrowing when authorization is enabled. It matches
            exactly against external_user_id, never falls back through email or
            username, and is never forwarded to Python.
      required: [query]
      additionalProperties: false
    SearchResult:
