# Explicit local development only. Generate the ignored files first with
# scripts/provision_local_cutover.py. No production service or issuer is changed.
x-local-cutover-queues: &local_cutover_queues
  TEMPORAL_RAG_WORKFLOW_TASK_QUEUE: rawki-local-workflow
  TEMPORAL_RAG_SCRAPER_TASK_QUEUE: rawki-local-scraper
  TEMPORAL_RAG_CONVERTER_TASK_QUEUE: rawki-local-converter
  TEMPORAL_RAG_INDEXER_TASK_QUEUE: rawki-local-indexer
  TEMPORAL_RAG_INGESTION_TASK_QUEUE: rawki-local-indexer
  TEMPORAL_CLIENT_IDENTITY: rawki-python-local
  HAWKI_RAG_WORKER_CALLBACK_URL: http://hawki_backend/internal/pipeline/worker-events
  HAWKI_WORKFLOW_CONTROL_URL: http://hawki_backend
  EXTERNAL_SCRAPER_URL: http://rawki-local-crawler:8080

x-local-cutover-worker: &local_cutover_worker
  env_file:
    - ${HAWKI_RAG_COMPOSE_ENV_FILE:-.env}
  environment: *local_cutover_queues
  volumes:
    - shared_storage:/shared
  group_add: !override
    - "${PGID}"
  networks: [default, hawki-network]
  depends_on:
    hawki_backend:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 60s

services:
  # New Python-owned work uses distinct queues. Legacy replicas are not changed
  # and cannot consume these executions or adopt their ownership records.
  rawki_local_workflow_worker:
    <<: *local_cutover_worker
    image: hawki-rag-workflow-worker:local
    build:
      context: .
      dockerfile: python_rag/Dockerfile
      target: workflow-runtime

  rawki_local_scraper_worker:
    <<: *local_cutover_worker
    image: hawki-rag-scraper-worker:local
    build:
      context: .
      dockerfile: python_rag/Dockerfile
      target: scraper-runtime

  rawki_local_converter_worker:
    <<: *local_cutover_worker
    image: hawki-rag-converter-worker:local
    build:
      context: .
      dockerfile: python_rag/Dockerfile
      target: converter-runtime

  rawki_local_indexer_worker:
    <<: *local_cutover_worker
    image: hawki-rag-indexer-worker:local
    build:
      context: .
      dockerfile: python_rag/Dockerfile
      target: indexer-runtime

  rawki_local_crawler:
    build:
      context: ./.local-runtime/crawler
      dockerfile: ../../docker/crawler/Dockerfile
      target: runtime
    image: hawki-crawler:permanent-job-v2-local
    pull_policy: never
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["hawki_crawler.app.main:app", "--host=0.0.0.0", "--port=8080", "--workers=1"]
    environment:
      DATA_PATH: /shared
      HOME: /tmp
      MAX_CONCURRENT_TASKS: "5"
      LOG_LEVEL: INFO
    volumes:
      - shared_storage:/shared
    security_opt:
      - seccomp=./docker/crawler/browser-seccomp.json
    shm_size: 1gb
    networks:
      default:
        aliases: [rawki-local-crawler]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 60s
    restart: unless-stopped

  hawki_rag_rerank:
    volumes:
      - rawki_local_reranker_cache:/home/rawki/.cache/huggingface/hub

  rawki_local_auth:
    image: hawki-backend:local
    pull_policy: never
    entrypoint: ["python", "-m", "uvicorn"]
    command:
      - server:app
      - --app-dir=/opt/rawki-local-auth
      - --host=0.0.0.0
      - --port=8443
      - --ssl-certfile=/run/rawki-local-auth/server.pem
      - --ssl-keyfile=/run/rawki-local-auth/server.key
      - --no-access-log
    environment:
      RAWKI_LOCAL_AUTH_ENABLED: "true"
      RAWKI_LOCAL_AUTH_DIRECTORY: /run/rawki-local-auth
    volumes:
      - ./docker/local_auth/server.py:/opt/rawki-local-auth/server.py:ro
      - ./.secrets/ui-service/issuer:/run/rawki-local-auth:ro
    networks:
      default:
        aliases: [rawki-local-auth]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://rawki-local-auth:8443/health', context=ssl.create_default_context(cafile='/run/rawki-local-auth/ca.pem'), timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  hawki_backend:
    environment:
      <<: *local_cutover_queues
      SSL_CERT_FILE: /run/local-auth/ca-bundle.pem
      TEMPORAL_CLIENT_IDENTITY: hawki-rag-python-local
      EXTERNAL_SCRAPER_URL: http://rawki-local-crawler:8080
      HAWKI_BACKEND_DATASET_GRAPH_ENABLED: "true"
      HAWKI_BACKEND_HISTORICAL_ARCHIVE_ROOT: /shared/.historical-orphans
    volumes:
      - ./.secrets/ui-service/ca-bundle.pem:/run/local-auth/ca-bundle.pem:ro
    depends_on:
      rawki_local_auth:
        condition: service_healthy
      rawki_local_crawler:
        condition: service_healthy

  hawki_rag_ui_gateway:
    environment:
      SSL_CERT_FILE: /run/local-auth/ca-bundle.pem
      HAWKI_RAG_UI_ORIGIN: http://localhost:8080
      HAWKI_RAG_UI_AUTHORIZATION_URL: https://rawki-local-auth:8443/authorize
      HAWKI_RAG_UI_TOKEN_URL: https://rawki-local-auth:8443/token
      HAWKI_RAG_UI_CLIENT_ID: rag-management
      HAWKI_RAG_UI_FORWARD_BASIC_AUTH: "true"
      HAWKI_RAG_UI_SCOPES: rag:query rag:ingest rag:datasets:manage
      EXTERNAL_SCRAPER_URL: http://rawki-local-crawler:8080
    volumes:
      - ./.secrets/ui-service/ca-bundle.pem:/run/local-auth/ca-bundle.pem:ro

  hawki_rag_frontend:
    # Local access credentials are distinct from API service credentials. The
    # guard lives in nginx and the development gate, never browser JavaScript.
    ports: !override
      - "127.0.0.1:8080:80"
    volumes:
      - ./.secrets/ui-service/frontend.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.secrets/ui-service/htpasswd:/run/local-auth/htpasswd:ro

volumes:
  rawki_local_reranker_cache:
    external: true
    name: rawki_local_reranker_cache
